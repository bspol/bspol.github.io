<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Hospital</title>

<style>

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #fff;

    overflow-x: hidden;
}

* {
    box-sizing: border-box;
}

.page-container {
    position: relative;

    width: 100%;
    margin: 0;
    padding: 0;

    line-height: 0;
}

.page-image {
    display: block;

    width: 100%;
    height: auto;

    margin: 0;
    padding: 0;

    border: 0;

    user-select: none;
    -webkit-user-drag: none;
}


/* ================================
   112
   ================================ */

#call112 {
    position: absolute;

    left: 4%;
    top: 45%;

    width: 28%;
    height: 14%;

    border: none;
    background: transparent;

    z-index: 1000;
}


/* ================================
   119
   ================================ */

#call119 {
    position: absolute;

    left: 36%;
    top: 45%;

    width: 28%;
    height: 14%;

    border: none;
    background: transparent;

    z-index: 1000;
}


/* ================================
   1330
   ================================ */

#call1330 {
    position: absolute;

    left: 68%;
    top: 45%;

    width: 28%;
    height: 14%;

    border: none;
    background: transparent;

    z-index: 1000;
}


/* ================================
   가까운 병원 찾기
   ================================ */

#findHospital {
    position: absolute;

    left: 4%;
    top: 61%;

    width: 28%;
    height: 26%;

    border: none;
    background: transparent;

    z-index: 1000;
}


/* ================================
   응급실 찾기
   ================================ */

#findEmergency {
    position: absolute;

    left: 36%;
    top: 61%;

    width: 28%;
    height: 26%;

    border: none;
    background: transparent;

    z-index: 1000;
}


/* ================================
   의료정보
   ================================ */

#medicalInfo {
    position: absolute;

    left: 68%;
    top: 61%;

    width: 28%;
    height: 26%;

    border: none;
    background: transparent;

    z-index: 1000;
}

</style>

</head>


<body>


<div class="page-container">

    <img
        src="../hospital_en.png"
        class="page-image"
        alt="Hospital"
    >


    <button
        id="call112"
        type="button"
        aria-label="112">
    </button>


    <button
        id="call119"
        type="button"
        aria-label="119">
    </button>


    <button
        id="call1330"
        type="button"
        aria-label="1330">
    </button>


    <button
        id="findHospital"
        type="button"
        aria-label="Find Hospital">
    </button>


    <button
        id="findEmergency"
        type="button"
        aria-label="Find Emergency Room">
    </button>


    <button
        id="medicalInfo"
        type="button"
        aria-label="Medical Information">
    </button>

</div>


<script>

/* ================================
   112
   ================================ */

document
.getElementById("call112")
.addEventListener("click", function() {

    window.location.href = "tel:112";

});


/* ================================
   119
   ================================ */

document
.getElementById("call119")
.addEventListener("click", function() {

    window.location.href = "tel:119";

});


/* ================================
   1330
   ================================ */

document
.getElementById("call1330")
.addEventListener("click", function() {

    window.location.href = "tel:1330";

});


/* ================================
   가까운 병원
   ================================ */

document
.getElementById("findHospital")
.addEventListener("click", function() {

    window.location.href =
        "https://www.google.com/maps/search/?api=1&query=hospital+near+me";

});


/* ================================
   응급실
   ================================ */

document
.getElementById("findEmergency")
.addEventListener("click", function() {

    window.location.href =
        "https://www.google.com/maps/search/?api=1&query=emergency+room+near+me";

});


/* ================================
   의료정보
   ================================ */

document
.getElementById("medicalInfo")
.addEventListener("click", function() {

    window.location.href =
        "../medical-info-en.png";

});

</script>


</body>

</html>
```
