<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>SAFE IN BUSAN</title>

<style>

/* ==========================
   기본 설정
   ========================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}


/* ==========================
   1080 × 1920 화면
   ========================== */

#app {
    position: relative;

    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7778vw);

    max-width: 1080px;
    max-height: 1920px;

    aspect-ratio: 1080 / 1920;

    overflow: hidden;

    background: #fff;
}


/* ==========================
   메인 이미지
   ========================== */

#mainImage {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    display: block;

    user-select: none;
    -webkit-user-drag: none;

    z-index: 1;
}


/* ==========================
   공통 터치 버튼
   ========================== */

.touch-button {
    position: absolute;

    display: block;

    z-index: 20;

    background: transparent;

    border: none;
    outline: none;

    text-decoration: none;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


/* ==================================================
   MAIN - 112
   ================================================== */

.call112 {
    left: 2%;
    top: 32.3%;

    width: 31%;
    height: 13.7%;
}


/* ==================================================
   MAIN - 119
   ================================================== */

.call119 {
    left: 34%;
    top: 32.3%;

    width: 31%;
    height: 13.7%;
}


/* ==================================================
   MAIN - 1330
   ================================================== */

.call1330 {
    left: 66%;
    top: 32.3%;

    width: 32%;
    height: 13.7%;
}


/* ==================================================
   MAIN - HOSPITAL
   ================================================== */

.hospital {
    left: 2%;
    top: 47.0%;

    width: 47.8%;
    height: 16.8%;
}


/* ==================================================
   MAIN - PHARMACY
   ================================================== */

.pharmacy {
    left: 50.2%;
    top: 47.0%;

    width: 47.8%;
    height: 16.8%;
}


/* ==================================================
   HOSPITAL PAGE
   ================================================== */

#hospitalPage {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: none;

    background: #fff;

    z-index: 100;
}


/* ==================================================
   HOSPITAL IMAGE
   ================================================== */

#hospitalImage {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    display: block;

    user-select: none;
    -webkit-user-drag: none;

    z-index: 101;
}


/* ==================================================
   🌐 언어 선택 버튼
   병원 화면 왼쪽 위
   ================================================== */

.language-button {
    position: absolute;

    left: 2.5%;
    top: 1.2%;

    width: 40%;
    height: 5.5%;

    padding: 0;

    border: none;

    background: transparent;

    color: white;

    display: flex;
    align-items: center;

    gap: 9px;

    font-size: clamp(15px, 2.5vw, 28px);

    text-align: left;

    cursor: pointer;

    z-index: 300;

    touch-action: manipulation;
}

.language-button .globe {
    font-size: clamp(27px, 3.8vw, 42px);
    line-height: 1;
}

.language-button .arrow {
    font-size: clamp(18px, 2.5vw, 28px);
    line-height: 1;
}


/* ==================================================
   언어 메뉴
   ================================================== */

#languageMenu {
    position: absolute;

    left: 2.5%;
    top: 6.2%;

    width: 42%;

    background: #fff;

    border-radius: 14px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.30);

    overflow: hidden;

    display: none;

    z-index: 400;
}

#languageMenu.show {
    display: block;
}

#languageMenu button {
    display: block;

    width: 100%;

    min-height: 48px;

    padding: 12px 16px;

    border: none;

    border-bottom: 1px solid #eeeeee;

    background: #fff;

    color: #222;

    font-size: clamp(14px, 2vw, 21px);

    text-align: left;

    cursor: pointer;

    touch-action: manipulation;
}

#languageMenu button:last-child {
    border-bottom: none;
}

#languageMenu button:active {
    background: #eeeeee;
}


/* ==================================================
   HOSPITAL - 112
   ================================================== */

.hospital-call112 {
    position: absolute;

    left: 4%;
    top: 45%;

    width: 28%;
    height: 14%;

    z-index: 250;
}


/* ==================================================
   HOSPITAL - 119
   ================================================== */

.hospital-call119 {
    position: absolute;

    left: 36%;
    top: 45%;

    width: 28%;
    height: 14%;

    z-index: 250;
}


/* ==================================================
   HOSPITAL - 1330
   ================================================== */

.hospital-call1330 {
    position: absolute;

    left: 68%;
    top: 45%;

    width: 28%;
    height: 14%;

    z-index: 250;
}


/* ==================================================
   HOSPITAL - FIND HOSPITAL
   ================================================== */

.find-hospital {
    position: absolute;

    left: 4%;
    top: 61%;

    width: 28%;
    height: 26%;

    z-index: 250;
}


/* ==================================================
   HOSPITAL - FIND EMERGENCY ROOM
   ================================================== */

.find-emergency {
    position: absolute;

    left: 36%;
    top: 61%;

    width: 28%;
    height: 26%;

    z-index: 250;
}


/* ==================================================
   HOSPITAL - MEDICAL INFORMATION
   ================================================== */

.medical-information {
    position: absolute;

    left: 68%;
    top: 61%;

    width: 28%;
    height: 26%;

    z-index: 250;
}


/* ==========================
   PC
   ========================== */

@media (min-width: 1081px) {

    #app {
        width: 540px;
        height: 960px;
    }

}


/* ==========================
   휴대폰
   ========================== */

@media (max-width: 600px) {

    #app {
        width: 100vw;
        height: 100vh;
        aspect-ratio: auto;
    }

}

</style>

</head>


<body>

<div id="app">


    <!-- ==================================================
         MAIN IMAGE
         ================================================== -->

    <img
        id="mainImage"
        src="./main_en.png"
        alt="SAFE IN BUSAN"
        draggable="false"
    >


    <!-- ==================================================
         MAIN - 112
         ================================================== -->

    <a
        href="tel:112"
        class="touch-button call112"
        aria-label="112">
    </a>


    <!-- ==================================================
         MAIN - 119
         ================================================== -->

    <a
        href="tel:119"
        class="touch-button call119"
        aria-label="119">
    </a>


    <!-- ==================================================
         MAIN - 1330
         ================================================== -->

    <a
        href="tel:1330"
        class="touch-button call1330"
        aria-label="1330">
    </a>


    <!-- ==================================================
         MAIN - HOSPITAL
         ================================================== -->

    <a
        href="#hospital"
        class="touch-button hospital"
        aria-label="Hospital"
        onclick="openHospital(); return false;">
    </a>


    <!-- ==================================================
         MAIN - PHARMACY
         ================================================== -->

    <a
        id="pharmacyButton"
        href="./pharmacy_en.png"
        class="touch-button pharmacy"
        aria-label="Pharmacy">
    </a>


    <!-- ==================================================
         HOSPITAL PAGE
         ================================================== -->

    <div id="hospitalPage">


        <!-- 병원 이미지 -->

        <img
            id="hospitalImage"
            src="./hospital_en.png"
            alt="Hospital"
            draggable="false"
        >


        <!-- ==================================================
             🌐 지구본
             ================================================== -->

        <button
            type="button"
            class="language-button"
            onclick="toggleLanguageMenu()">

            <span class="globe">🌐</span>

            <span id="currentLanguage">
                English
            </span>

            <span class="arrow">
                ⌄
            </span>

        </button>


        <!-- ==================================================
             7개 언어
             ================================================== -->

        <div id="languageMenu">

            <button
                type="button"
                onclick="selectLanguage('en')">
                English
            </button>

            <button
                type="button"
                onclick="selectLanguage('jp')">
                日本語
            </button>

            <button
                type="button"
                onclick="selectLanguage('cn')">
                中文
            </button>

            <button
                type="button"
                onclick="selectLanguage('ru')">
                Русский
            </button>

            <button
                type="button"
                onclick="selectLanguage('vn')">
                Tiếng Việt
            </button>

            <button
                type="button"
                onclick="selectLanguage('mn')">
                Монгол хэл
            </button>

            <button
                type="button"
                onclick="selectLanguage('ph')">
                Filipino
            </button>

        </div>


        <!-- ==================================================
             HOSPITAL - 112
             ================================================== -->

        <a
            href="tel:112"
            class="touch-button hospital-call112"
            aria-label="112">
        </a>


        <!-- ==================================================
             HOSPITAL - 119
             ================================================== -->

        <a
            href="tel:119"
            class="touch-button hospital-call119"
            aria-label="119">
        </a>


        <!-- ==================================================
             HOSPITAL - 1330
             ================================================== -->

        <a
            href="tel:1330"
            class="touch-button hospital-call1330"
            aria-label="1330">
        </a>


        <!-- ==================================================
             FIND HOSPITAL
             ================================================== -->

        <a
            href="https://www.google.com/maps/search/?api=1&query=hospital"
            target="_blank"
            rel="noopener noreferrer"
            class="touch-button find-hospital"
            aria-label="Find Hospital">
        </a>


        <!-- ==================================================
             FIND EMERGENCY ROOM
             ================================================== -->

        <a
            href="https://www.google.com/maps/search/?api=1&query=emergency+room"
            target="_blank"
            rel="noopener noreferrer"
            class="touch-button find-emergency"
            aria-label="Find Emergency Room">
        </a>


        <!-- ==================================================
             MEDICAL INFORMATION
             ================================================== -->

        <a
            id="medicalInformation"
            href="./medical-info-en.png"
            target="_blank"
            rel="noopener noreferrer"
            class="touch-button medical-information"
            aria-label="Medical Information">
        </a>


    </div>


</div>


<script>

/* ==================================================
   현재 언어
   ================================================== */

let currentLanguage = "en";


/* ==================================================
   7개 언어 파일
   ================================================== */

const languageData = {

    en: {
        name: "English",
        main: "./main_en.png",
        hospital: "./hospital_en.png",
        pharmacy: "./pharmacy_en.png",
        medical: "./medical-info-en.png"
    },

    jp: {
        name: "日本語",
        main: "./main_jp.png",
        hospital: "./hospital_jp.png",
        pharmacy: "./pharmacy_jp.png",
        medical: "./medical-info-jp.png"
    },

    cn: {
        name: "中文",
        main: "./main_cn.png",
        hospital: "./hospital_cn.png",
        pharmacy: "./pharmacy_cn.png",
        medical: "./medical-info-cn.png"
    },

    ru: {
        name: "Русский",
        main: "./main_ru.png",
        hospital: "./hospital_ru.png",
        pharmacy: "./pharmacy_ru.png",
        medical: "./medical-info-ru.png"
    },

    vn: {
        name: "Tiếng Việt",
        main: "./main_vn.png",
        hospital: "./hospital_vn.png",
        pharmacy: "./pharmacy_vn.png",
        medical: "./medical-info-vn.png"
    },

    mn: {
        name: "Монгол хэл",
        main: "./main_mn.png",
        hospital: "./hospital_mn.png",
        pharmacy: "./pharmacy_mn.png",
        medical: "./medical-info-mn.png"
    },

    ph: {
        name: "Filipino",
        main: "./main_ph.png",
        hospital: "./hospital_ph.png",
        pharmacy: "./pharmacy_ph.png",
        medical: "./medical-info-ph.png"
    }

};


/* ==================================================
   병원 열기
   ================================================== */

function openHospital() {

    const data =
        languageData[currentLanguage];

    if (!data) return;


    /* 현재 언어의 병원 */

    document.getElementById(
        "hospitalImage"
    ).src = data.hospital;


    /* 현재 언어 표시 */

    document.getElementById(
        "currentLanguage"
    ).textContent = data.name;


    /* 현재 언어 의료정보 */

    document.getElementById(
        "medicalInformation"
    ).href = data.medical;


    /* 메인 숨김 */

    document.getElementById(
        "mainImage"
    ).style.display = "none";


    /* 병원 표시 */

    document.getElementById(
        "hospitalPage"
    ).style.display = "block";


    /* 언어 메뉴 닫기 */

    document.getElementById(
        "languageMenu"
    ).classList.remove("show");

}


/* ==================================================
   🌐 언어 메뉴 열기
   ================================================== */

function toggleLanguageMenu() {

    const menu =
        document.getElementById("languageMenu");

    menu.classList.toggle("show");

}


/* ==================================================
   🌐 언어 선택
   ⭐ 병원 → 해당 나라 MAIN
   ================================================== */

function selectLanguage(lang) {

    const data =
        languageData[lang];

    if (!data) return;


    currentLanguage = lang;


    /*
       ⭐⭐⭐ 핵심 ⭐⭐⭐

       병원에서 언어를 선택하면
       해당 언어의 MAIN 화면으로 이동
    */

    document.getElementById(
        "hospitalPage"
    ).style.display = "none";


    document.getElementById(
        "mainImage"
    ).style.display = "block";


    document.getElementById(
        "mainImage"
    ).src = data.main;


    /*
       해당 언어의 약국 연결
    */

    document.getElementById(
        "pharmacyButton"
    ).href = data.pharmacy;


    /*
       메뉴 닫기
    */

    document.getElementById(
        "languageMenu"
    ).classList.remove("show");

}


/* ==================================================
   약국 버튼
   현재 언어에 맞는 약국 이미지 연결
   ================================================== */

document.getElementById(
    "pharmacyButton"
).addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        const data =
            languageData[currentLanguage];

        if (data && data.pharmacy) {

            window.location.href =
                data.pharmacy;

        }

    }
);


/* ==================================================
   시작 화면
   ================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        currentLanguage = "en";


        document.getElementById(
            "mainImage"
        ).src = "./main_en.png";


        document.getElementById(
            "hospitalPage"
        ).style.display = "none";


        document.getElementById(
            "pharmacyButton"
        ).href = "./pharmacy_en.png";

    }
);

</script>


</body>

</html>
