<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>SAFE IN BUSAN</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    /* 전체 화면 */
    .main-container {
      position: relative;
      width: 100%;
      max-width: 1080px;
      line-height: 0;
    }

    /* 1080 × 1920 메인 이미지 */
    .main-image {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      투명 클릭 영역
      이미지 위에 absolute로 배치
    */
    .language-link {
      position: absolute;
      display: block;
      z-index: 10;

      /* 투명 */
      background: transparent;

      /* 클릭 영역 확인할 때만 사용
         background: rgba(255,0,0,0.2);
      */

      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* --------------------------------
       1. ENGLISH
       이미지 기준:
       x 약 70~235
       y 약 880~1045
       -------------------------------- */
    .english {
      left: 8.1%;
      top: 57.3%;
      width: 19.5%;
      height: 10.7%;
    }

    /* --------------------------------
       2. JAPANESE
       -------------------------------- */
    .japanese {
      left: 29.8%;
      top: 57.3%;
      width: 19.5%;
      height: 10.7%;
    }

    /* --------------------------------
       3. CHINESE
       -------------------------------- */
    .chinese {
      left: 51.7%;
      top: 57.3%;
      width: 19.5%;
      height: 10.7%;
    }

    /* --------------------------------
       4. VIETNAMESE
       -------------------------------- */
    .vietnamese {
      left: 73.6%;
      top: 57.3%;
      width: 19.5%;
      height: 10.7%;
    }

    /* --------------------------------
       5. MONGOLIAN
       -------------------------------- */
    .mongolian {
      left: 12.5%;
      top: 69.2%;
      width: 22.5%;
      height: 10.8%;
    }

    /* --------------------------------
       6. FILIPINO
       -------------------------------- */
    .filipino {
      left: 38.1%;
      top: 69.2%;
      width: 22.5%;
      height: 10.8%;
    }

    /* --------------------------------
       7. RUSSIAN
       -------------------------------- */
    .russian {
      left: 63.8%;
      top: 69.2%;
      width: 22.5%;
      height: 10.8%;
    }

    /*
      작은 화면에서도 이미지 비율 유지
    */
    @media (max-width: 600px) {

      .main-container {
        width: 100%;
      }

    }
  </style>
</head>

<body>

  <div class="main-container">

    <!-- 메인 이미지 -->
    <img
      src="main.png"
      alt="SAFE IN BUSAN"
      class="main-image"
    >

    <!-- =========================
         언어 선택 영역
         ========================= -->

    <!-- ENGLISH -->
    <a
      href="main_en/"
      class="language-link english"
      aria-label="English">
    </a>

    <!-- 日本語 -->
    <a
      href="main_jp/"
      class="language-link japanese"
      aria-label="日本語">
    </a>

    <!-- 中文 -->
    <a
      href="main_cn/"
      class="language-link chinese"
      aria-label="中文">
    </a>

    <!-- TIẾNG VIỆT -->
    <a
      href="main_vn/"
      class="language-link vietnamese"
      aria-label="Tiếng Việt">
    </a>

    <!-- МОНГОЛ -->
    <a
      href="main_mn/"
      class="language-link mongolian"
      aria-label="Монгол">
    </a>

    <!-- FILIPINO -->
    <a
      href="main_ph/"
      class="language-link filipino"
      aria-label="Filipino">
    </a>

    <!-- РУССКИЙ -->
    <a
      href="main_ru/"
      class="language-link russian"
      aria-label="Русский">
    </a>

  </div>

</body>
</html>
