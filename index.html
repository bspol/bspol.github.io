<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Busan Foreigner Safety Platform</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b1d3a;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 20px;
        }
        .main-img {
            width: 100%;
            height: auto;
            display: none;
        }
        .main-img.active {
            display: block;
        }
        
        /* 🚨 터치 레이어 공통 스타일 (최상단 노출 보장) */
        .touch-link {
            position: absolute;
            cursor: pointer;
            background-color: rgba(255, 0, 0, 0.35);
            display: none;
            z-index: 1000;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            pointer-events: auto;
        }

        /* 💡 빨간색 박스로 버튼 영역을 눈으로 직접 확인하시려면 아래 주석(/* */)을 해제하세요 */
        /* .touch-link { background-color: rgba(255, 0, 0, 0.4) !important; } */

        /* [1. 대표 메인 홈 화면 버튼 (home.png)] */
        .btn-en { top: 55.6%; left: 6.7%; width: 86.6%; height: 6.2%; z-index: 99999; }
        .btn-cn { top: 62.4%; left: 6.7%; width: 86.6%; height: 6.2%; z-index: 2000; }
        .btn-jp { top: 69.2%; left: 6.7%; width: 86.6%; height: 6.2%; z-index: 2000; }
        .btn-vn { top: 76.0%; left: 6.7%; width: 86.6%; height: 6.2%; z-index: 2000; }

        .home-phone { top: 81.5%; height: 10.5%; z-index: 2000; }
        .home-112 { left: 6.7%; width: 27.5%; }
        .home-119 { left: 36.2%; width: 27.5%; }
        .home-1330 { left: 65.8%; width: 27.5%; }

        /* [2. 상단 지구본 드롭다운 메뉴 버튼] */
        .btn-lang-dropdown { top: 0.5%; left: 2.0%; width: 25.0%; height: 5.0%; z-index: 9000; } 

        /* [3. 언어별 메인 화면(main_en/cn/jp/vn) 중간 6대 메뉴] */
        .click-hospital  { top: 45.4%; left: 2.5%; width: 46.5%; height: 14.0%; z-index: 1500; }
        .click-pharmacy  { top: 45.4%; left: 51.0%; width: 46.5%; height: 14.0%; z-index: 1500; }
        .click-embassy   { top: 62.0%; left: 2.5%; width: 46.5%; height: 14.0%; z-index: 1500; }
        .click-lost      { top: 62.0%; left: 51.0%; width: 46.5%; height: 14.0%; z-index: 1500; }
        .click-rules     { top: 78.0%; left: 2.5%; width: 46.5%; height: 14.0%; z-index: 1500; }
        .click-spots     { top: 78.0%; left: 51.0%; width: 46.5%; height: 14.0%; z-index: 1500; }

        /* [4. 🚓 최하단 고정 긴급신고 버튼 (홈 제외 모든 페이지에서 최우선 터치)] */
        .sub-call-112  { top: 86.5%; left: 26.5%; width: 14.0%; height: 7.5%; z-index: 3000; }
        .sub-call-119  { top: 86.5%; left: 41.5%; width: 14.0%; height: 7.5%; z-index: 3000; }
        .sub-call-1330 { top: 86.5%; left: 56.5%; width: 14.0%; height: 7.5%; z-index: 3000; }

        /* [5. 병원/약국 외부 상세 링크] */
        .hospital-ext-link { top: 82.0%; left: 5.0%; width: 90.0%; height: 12.0%; z-index: 1500; }
        .pharmacy-ext-link { top: 82.0%; left: 5.0%; width: 90.0%; height: 12.0%; z-index: 1500; }

        /* 언어 선택 드롭다운 스타일 */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 5.5%; 
            left: 2.0%;
            width: 150px;
            background-color: #12284c;
            border: 1px solid #234375;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            z-index: 9999;
            padding: 5px 0;
        }
        .dropdown-menu a {
            display: block;
            color: #ffffff;
            padding: 12px 15px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #1c3966;
        }
        .dropdown-menu a:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ▣ 이미지 보관함 -->
        <img id="img-home" class="main-img active" src="home.png" alt="Home">
        <img id="img-en" class="main-img" src="main_en.png" alt="English">
        <img id="img-cn" class="main-img" src="main_cn.png" alt="Chinese">
        <img id="img-jp" class="main-img" src="main_jp.png" alt="Japanese">
        <img id="img-vn" class="main-img" src="main_vn.png" alt="Vietnamese">

        <!-- 서브 화면들 -->
        <img id="img-sub-rules" class="main-img" src="basicrules.png" alt="Basic Rules">
        <img id="img-sub-embassy" class="main-img" src="embassy.png" alt="Embassies">
        <img id="img-sub-medinfo" class="main-img" src="medical_info.png" alt="Medical Info">

        <!-- 병원 서브 화면들 -->
        <img id="img-sub-hospital-en" class="main-img" src="hospital_en.png" alt="Hospital EN">
        <img id="img-sub-hospital-cn" class="main-img" src="hospital_cn.png" alt="Hospital CN">
        <img id="img-sub-hospital-jp" class="main-img" src="hospital_jp.png" alt="Hospital JP">
        <img id="img-sub-hospital-vn" class="main-img" src="hospital_vn.png" alt="Hospital VN">

        <!-- 약국 서브 화면들 -->
        <img id="img-sub-pharmacy-en" class="main-img" src="pharmacy_en.png" alt="Pharmacy EN">
        <img id="img-sub-pharmacy-cn" class="main-img" src="pharmacy_cn.png" alt="Pharmacy CN">
        <img id="img-sub-pharmacy-jp" class="main-img" src="pharmacy_jp.png" alt="Pharmacy JP">
        <img id="img-sub-pharmacy-vn" class="main-img" src="pharmacy_vn.png" alt="Pharmacy VN">


        <!-- ▣ 터치 레이어 배포 구역 -->
        
        <!-- [1. 홈 화면 국가 선택 버튼] -->
        <a id="area-en" href="javascript:void(0)" class="touch-link btn-en" onclick="goPage('en')"></a>
        <a id="area-cn" href="javascript:void(0)" class="touch-link btn-cn" onclick="goPage('cn')"></a>
        <a id="area-jp" href="javascript:void(0)" class="touch-link btn-jp" onclick="goPage('jp')"></a>
        <a id="area-vn" href="javascript:void(0)" class="touch-link btn-vn" onclick="goPage('vn')"></a>

        <a id="h-112" href="tel:112" class="touch-link home-phone home-112"></a>
        <a id="h-119" href="tel:119" class="touch-link home-phone home-119"></a>
        <a id="h-1330" href="tel:1330" class="touch-link home-phone home-1330"></a>

        <!-- [2. 상단 지구본 드롭다운] -->
        <a id="area-lang-dropdown" href="javascript:void(0)" class="touch-link btn-lang-dropdown" onclick="toggleDropdown(event)"></a>

        <div id="langDropdown" class="dropdown-menu">
            <a href="javascript:void(0)" onclick="goPage('home')">🏠 메인 (Home)</a>
            <a href="javascript:void(0)" onclick="goPage('en')">🇺🇸 English</a>
            <a href="javascript:void(0)" onclick="goPage('cn')">🇨🇳 中文 (简体)</a>
            <a href="javascript:void(0)" onclick="goPage('jp')">🇯🇵 日本語</a>
            <a href="javascript:void(0)" onclick="goPage('vn')">🇻🇳 Tiếng Việt</a>
        </div>

        <!-- [3. 서브화면 공통 고정 긴급신고 버튼 (112, 119, 1330)] -->
        <a id="c-112" href="tel:112" class="touch-link sub-call-112"></a>
        <a id="c-119" href="tel:119" class="touch-link sub-call-119"></a>
        <a id="c-1330" href="tel:1330" class="touch-link sub-call-1330"></a>

        <!-- [4. 언어별 메인 화면 하부 6대 메뉴] -->
        <a id="click-hosp" href="javascript:void(0)" class="touch-link click-hospital" onclick="clickSubMenu('hospital')"></a>
        <a id="click-phar" href="javascript:void(0)" class="touch-link click-pharmacy" onclick="clickSubMenu('pharmacy')"></a>
        <a id="click-emba" href="javascript:void(0)" class="touch-link click-embassy" onclick="goPage('sub-embassy')"></a>
        <a id="click-lost" href="https://minwon24.police.go.kr/cvlcpt/cvlcptAply.do?cvlcptId=MW-201&keyword=" target="_blank" class="touch-link click-lost"></a>
        <a id="click-rule" href="javascript:void(0)" class="touch-link click-rules" onclick="goPage('sub-rules')"></a>
        <a id="click-spot" href="https://www.google.com/maps/search/Busan+tourist+map/data=!3m1!4b1?entry=ttu&amp;g_ep=EgoyMDI2MDQxNS4wIKXMDSoASAFQAw==" target="_blank" class="touch-link click-spots"></a>

        <!-- [5. 상세화면 외부 연결 버튼] -->
        <a id="go-ext-hospital" href="https://www.e-gen.or.kr/egen/main.do" target="_blank" class="touch-link hospital-ext-link"></a>
        <a id="go-ext-pharmacy" href="https://www.pharm114.or.kr/" target="_blank" class="touch-link pharmacy-ext-link"></a>
    </div>

    <script>
        var currentLang = 'en';

        function setDisplay(id, show) {
            var el = document.getElementById(id);
            if (el) {
                el.style.display = show ? 'block' : 'none';
            }
        }

        function goPage(pageId) {
            // 드롭다운 닫기
            var dropdown = document.getElementById('langDropdown');
            if (dropdown) dropdown.style.display = 'none';

            // 이미지 교체
            var images = document.getElementsByClassName('main-img');
            for (var i = 0; i < images.length; i++) {
                images[i].classList.remove('active');
            }

            var targetImg = document.getElementById('img-' + pageId);
            if (targetImg) {
                targetImg.classList.add('active');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // 언어 기억
            if (pageId === 'en' || pageId === 'cn' || pageId === 'jp' || pageId === 'vn') {
                currentLang = pageId;
            }

            var isHome = (pageId === 'home');
            var isMainLang = (pageId === 'en' || pageId === 'cn' || pageId === 'jp' || pageId === 'vn');
            var isHospitalSub = pageId.indexOf('hospital') !== -1;
            var isPharmacySub = pageId.indexOf('pharmacy') !== -1;

            // 1. 홈 화면 버튼 제어
            setDisplay('area-en', isHome);
            setDisplay('area-cn', isHome);
            setDisplay('area-jp', isHome);
            setDisplay('area-vn', isHome);
            setDisplay('h-112', isHome);
            setDisplay('h-119', isHome);
            setDisplay('h-1330', isHome);

            // 2. 지구본 드롭다운 버튼 (홈이 아닐 때 항시 노출)
            setDisplay('area-lang-dropdown', !isHome);

            // 3. 서브페이지 하단 긴급신고 버튼 (홈이 아닐 때 항시 노출 및 가장 상단 위치)
            setDisplay('c-112', !isHome);
            setDisplay('c-119', !isHome);
            setDisplay('c-1330', !isHome);

            // 4. 언어별 메인(main_en/cn/jp/vn) 중간 6개 메뉴
            setDisplay('click-hosp', isMainLang);
            setDisplay('click-phar', isMainLang);
            setDisplay('click-emba', isMainLang);
            setDisplay('click-lost', isMainLang);
            setDisplay('click-rule', isMainLang);
            setDisplay('click-spot', isMainLang);

            // 5. 외부 링크 버튼 (병원/약국 상세에만 노출)
            setDisplay('go-ext-hospital', isHospitalSub);
            setDisplay('go-ext-pharmacy', isPharmacySub);
        }

        function toggleDropdown(event) {
            if (event) event.stopPropagation(); 
            var dropdown = document.getElementById('langDropdown');
            if (dropdown) {
                dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
            }
        }

        document.addEventListener('click', function(e) {
            var dropdown = document.getElementById('langDropdown');
            var dropdownBtn = document.getElementById('area-lang-dropdown');
            if (dropdown && e.target !== dropdownBtn && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        function clickSubMenu(type) {
            if (type === 'hospital') {
                var extHospital = document.getElementById('go-ext-hospital');
                extHospital.href = "https://www.e-gen.or.kr/egen/main.do";
                goPage('sub-hospital-' + currentLang);
            } else if (type === 'pharmacy') {
                var extPharmacy = document.getElementById('go-ext-pharmacy');
                extPharmacy.href = "https://www.pharm114.or.kr/";
                goPage('sub-pharmacy-' + currentLang);
            }
        }

        // 초기 화면 설정
        window.onload = function() {
            goPage('home');
        };
    </script>

</body>
</html>
