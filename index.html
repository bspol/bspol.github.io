var currentLang = "en";

/* =========================================================
   표시 / 숨김
   ========================================================= */

function setDisplay(id, show) {

    var el = document.getElementById(id);

    if (el) {

        el.style.display =
            show ? "block" : "none";

        el.style.pointerEvents =
            show ? "auto" : "none";
    }
}


/* =========================================================
   페이지 이동
   ========================================================= */

function goPage(pageId) {

    if (!pageId) {
        return;
    }

    currentPage = pageId;


    /* -----------------------------------------------------
       언어 메뉴 닫기
       ----------------------------------------------------- */

    var dropdown =
        document.getElementById("langDropdown");

    if (dropdown) {
        dropdown.style.display = "none";
    }


    /* -----------------------------------------------------
       모든 이미지 숨기기
       ----------------------------------------------------- */

    var images =
        document.getElementsByClassName("main-img");

    for (var i = 0; i < images.length; i++) {

        images[i].classList.remove("active");
    }


    /* -----------------------------------------------------
       선택 이미지 표시
       ----------------------------------------------------- */

    var target =
        document.getElementById("img-" + pageId);

    if (target) {

        target.classList.add("active");

    } else {

        console.log(
            "페이지를 찾을 수 없습니다:",
            pageId
        );

        return;
    }


    /* -----------------------------------------------------
       언어 저장
       ----------------------------------------------------- */

    if (
        pageId === "en" ||
        pageId === "cn" ||
        pageId === "jp" ||
        pageId === "vn" ||
        pageId === "ru" ||
        pageId === "mn" ||
        pageId === "ph"
    ) {

        currentLang = pageId;
    }

    var lawLangMatch =
        pageId.match(/-(en|jp|cn|vn|mn|ph|ru)$/);

    if (lawLangMatch) {
        currentLang = lawLangMatch[1];
    }


    /* -----------------------------------------------------
       페이지 종류
       ----------------------------------------------------- */

    var isHome =
        pageId === "home";


    var isMainLang =
        pageId === "en" ||
        pageId === "cn" ||
        pageId === "jp" ||
        pageId === "vn" ||
        pageId === "ru" ||
        pageId === "mn" ||
        pageId === "ph";


    var isPharmacySub =
        pageId.indexOf("pharmacy") !== -1;


    var isHospitalSub =
        pageId.indexOf("hospital") !== -1;


    var isMedInfoSub =
        pageId.indexOf("medinfo") !== -1;


    var isEmbassySub =
        pageId === "sub-embassy";


    var isLawOverview =
        pageId === "sub-law-en" ||
        pageId === "sub-law-jp" ||
        pageId === "sub-law-cn" ||
        pageId === "sub-law-vn" ||
        pageId === "sub-law-mn" ||
        pageId === "sub-law-ph" ||
        pageId === "sub-law-ru";

    var isLawDetail =
        pageId.indexOf("sub-law-sexual-") === 0 ||
        pageId.indexOf("sub-law-driving-") === 0 ||
        pageId.indexOf("sub-law-theft-") === 0 ||
        pageId.indexOf("sub-law-voice-") === 0 ||
        pageId.indexOf("sub-law-drugs-") === 0 ||
        pageId.indexOf("sub-law-basicrules-") === 0;

    var isRulesSub =
        isLawOverview || isLawDetail;


    /* =====================================================
       HOME
       ===================================================== */

    setDisplay("area-en", isHome);
    setDisplay("area-jp", isHome);
    setDisplay("area-cn", isHome);
    setDisplay("area-vn", isHome);
    setDisplay("area-mn", isHome);
    setDisplay("area-ph", isHome);
    setDisplay("area-ru", isHome);

    setDisplay("h-112", isHome);
    setDisplay("h-119", isHome);
    setDisplay("h-1330", isHome);


    /* =====================================================
       지구본
       ★ HOME에서는 숨김
       ★ MAIN / 병원 / 약국에서만 표시
       ===================================================== */

    var showLanguageSelector =
        isHospitalSub ||
        isPharmacySub ||
        isLawOverview;

    setDisplay(
        "area-lang-dropdown",
        showLanguageSelector
    );


    /* =====================================================
       MAIN
       ===================================================== */

    setDisplay("main-home", isMainLang);

    setDisplay("m-112", isMainLang);
    setDisplay("m-119", isMainLang);
    setDisplay("m-1330", isMainLang);

    setDisplay("click-hosp", isMainLang);
    setDisplay("click-phar", isMainLang);
    setDisplay("click-emba", isMainLang);
    setDisplay("click-lost", isMainLang);
    setDisplay("click-rule", isMainLang);
    setDisplay("click-spots", isMainLang);


    /* =====================================================
       PHARMACY
       ===================================================== */

    setDisplay("p-112", isPharmacySub);
    setDisplay("p-119", isPharmacySub);
    setDisplay("p-1330", isPharmacySub);
    setDisplay("p-late", isPharmacySub);


    /* =====================================================
       HOSPITAL
       ===================================================== */

    setDisplay("hp-112", isHospitalSub);
    setDisplay("hp-119", isHospitalSub);
    setDisplay("hp-1330", isHospitalSub);
    setDisplay("hp-find", isHospitalSub);
    setDisplay("hp-emer", isHospitalSub);
    setDisplay("hp-med", isHospitalSub);


    /* =====================================================
       MEDICAL
       ===================================================== */

    setDisplay("med-112", isMedInfoSub);
    setDisplay("med-119", isMedInfoSub);
    setDisplay("med-1330", isMedInfoSub);


    /* =====================================================
       RULES
       ===================================================== */

    setDisplay("rules-112", isRulesSub);
    setDisplay("rules-119", isRulesSub);
    setDisplay("rules-1330", isRulesSub);

    setDisplay("law-item-01", isLawOverview);
    setDisplay("law-item-02", isLawOverview);
    setDisplay("law-item-03", isLawOverview);
    setDisplay("law-item-04", isLawOverview);
    setDisplay("law-item-05", isLawOverview);
    setDisplay("law-item-06", isLawOverview);

    setDisplay("law-back", isRulesSub);


    /* =====================================================
       EMBASSY
       ===================================================== */


    setDisplay("emb-back", isEmbassySub);
    setDisplay("med-back", isMedInfoSub);


    /* =====================================================
       영사관 국가 버튼
       ===================================================== */

    for (var i = 1; i <= 7; i++) {

        setDisplay("e" + i + "-call", isEmbassySub);
        setDisplay("e" + i + "-home", isEmbassySub);
    }


    /* -----------------------------------------------------
       페이지 맨 위
       ----------------------------------------------------- */

    window.scrollTo(
        0,
        0
    );
}


/* =========================================================
   LAW 뒤로가기
   ========================================================= */

function goLawBack() {

    if (
        currentPage.indexOf("sub-law-sexual-") === 0 ||
        currentPage.indexOf("sub-law-driving-") === 0 ||
        currentPage.indexOf("sub-law-theft-") === 0 ||
        currentPage.indexOf("sub-law-voice-") === 0 ||
        currentPage.indexOf("sub-law-drugs-") === 0 ||
        currentPage.indexOf("sub-law-basicrules-") === 0
    ) {
        goPage("sub-law-" + currentLang);
    } else {
        goPage(currentLang);
    }
}


/* =========================================================
   언어 선택
   ========================================================= */

function selectLanguage(lang) {

    if (!lang) {
        return;
    }

    var dropdown =
        document.getElementById("langDropdown");

    if (dropdown) {
        dropdown.style.display = "none";
    }

    if (
        currentPage === "sub-law-en" ||
        currentPage === "sub-law-jp" ||
        currentPage === "sub-law-cn" ||
        currentPage === "sub-law-vn" ||
        currentPage === "sub-law-mn" ||
        currentPage === "sub-law-ph" ||
        currentPage === "sub-law-ru"
    ) {
        currentLang = lang;
        goPage("sub-law-" + lang);
        return;
    }

    if (currentPage.indexOf("sub-hospital-") === 0) {
        currentLang = lang;
        goPage("sub-hospital-" + lang);
        return;
    }

    if (currentPage.indexOf("sub-pharmacy-") === 0) {
        currentLang = lang;
        goPage("sub-pharmacy-" + lang);
        return;
    }

    goPage(lang);
}


/* =========================================================
   지구본 메뉴
   ========================================================= */

function toggleDropdown(event) {

    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }

    var dropdown =
        document.getElementById(
            "langDropdown"
        );

    if (!dropdown) {
        return;
    }

    if (
        dropdown.style.display === "block"
    ) {

        dropdown.style.display =
            "none";

    } else {

        dropdown.style.display =
            "block";
    }
}


/* =========================================================
   메뉴 바깥 클릭
   ========================================================= */

document.addEventListener(
    "click",
    function(e) {

        var dropdown =
            document.getElementById(
                "langDropdown"
            );

        var button =
            document.getElementById(
                "area-lang-dropdown"
            );

        if (
            dropdown &&
            e.target !== button &&
            !dropdown.contains(e.target)
        ) {

            dropdown.style.display =
                "none";
        }

    }
);


/* =========================================================
   병원 / 약국
   ========================================================= */

function clickSubMenu(type) {

    if (type === "hospital") {

        goPage(
            "sub-hospital-" +
            currentLang
        );

    } else if (type === "pharmacy") {

        goPage(
            "sub-pharmacy-" +
            currentLang
        );
    }
}


/* =========================================================
   초기 화면
   ========================================================= */

window.addEventListener(
    "load",
    function() {

        /*
         * 반드시 HOME부터 시작
         */

        goPage("home");

    }
);
