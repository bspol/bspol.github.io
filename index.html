.safe-talk-status {
    min-height: 20px;
    margin: 10px 0 0;
    font-size: 13px;
    font-weight: 700;
}
.safe-talk-divider {
    height: 1px;
    background: #e6e9ed;
    margin: 20px 0 15px;
}
.safe-talk-list-title { margin: 0 0 10px; font-size: 16px; }
.safe-talk-list { display: grid; gap: 9px; }
.safe-talk-card {
    border: 1px solid #e0e5ea;
    border-radius: 11px;
    padding: 11px 12px;
    background: #fafbfc;
}
.safe-talk-card-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
    font-size: 12px;
    color: #667;
}
.safe-talk-card-message {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    line-height: 1.45;
}
.safe-talk-empty { color: #777; font-size: 13px; }
@media (max-width: 640px) {
.safe-talk-overlay { padding: 10px; }
    .safe-talk-modal { margin: 10px auto; }
}


/* =========================================================
   각 나라 MAIN 이미지 속 BUSAN SAFETY TALK 영역
   ========================================================= */
.main-safe-talk-link {
    top: 78.3%;
    left: 1.5%;
    width: 97.0%;
    height: 7.8%;
    z-index: 1000000000;
    pointer-events: auto !important;
}

/* =========================================================
   FAST IMAGE LOADER
   - WebP 우선
   - PNG 자동 fallback
   - 사용자가 누를 가능성이 높은 다음 화면 미리받기
   ========================================================= */

var imagePrefetchCache = Object.create(null);

function loadOptimizedImage(img) {
    if (!img || img.getAttribute("src")) return;

    var webp = img.getAttribute("data-webp");
    if (!webp) return;

    img.decoding = "async";
    img.src = webp;
}

function prefetchImage(url, fallbackUrl) {
    if (!url || imagePrefetchCache[url]) return;
    imagePrefetchCache[url] = true;

    var img = new Image();
    img.decoding = "async";
    if (fallbackUrl) {
        img.onerror = function() {
            img.onerror = null;
            var fallback = new Image();
            fallback.decoding = "async";
            fallback.src = fallbackUrl;
        };
    }
    img.src = url;
}

function prefetchPage(pageId) {
    var img = document.getElementById("img-" + pageId);
    if (!img) return;

    var webp = img.getAttribute("data-webp");
    if (webp) {
        prefetchImage(webp, null);
    }
}

function canSmartPrefetch() {
    var c = navigator.connection ||
            navigator.mozConnection ||
            navigator.webkitConnection;

    if (!c) return true;
    if (c.saveData) return false;

    /* 2G/slow-2g에서는 사용자가 누르기 전까지 추가 다운로드 금지 */
    if (c.effectiveType === "2g" || c.effectiveType === "slow-2g") {
        return false;
    }
    return true;
}

/* =========================================================
   LAW 상세페이지 즉시 사전 로딩
   - 법과 질서 8개 메뉴 화면에 들어오는 순간
     현재 언어의 상세 이미지를 바로 다운로드 시작
   - 기존 이동/터치 로직은 변경하지 않음
   ========================================================= */
function preloadLawMenuDetails(lang) {
    if (!lang || !canSmartPrefetch()) return;

    var pages = [
        "sub-law-basicrules-",
        "sub-law-sexual-",
        "sub-law-theft-",
        "sub-law-drugs-",
        "sub-law-driving-",
        "sub-law-voice-",
        "sub-law-firearms-",
        "sub-law-exemption-"
    ];

    for (var i = 0; i < pages.length; i++) {
        loadOptimizedImage(
            document.getElementById("img-" + pages[i] + lang)
        );
    }
}

/* 기초질서 목록에 들어오면 5개 세부페이지도 바로 준비 */
function preloadBasicRulesDetails(lang) {
    if (!lang || !canSmartPrefetch()) return;

    var pages = [
        "sub-law-basicrules-walk-",
        "sub-law-basicrules-littering-",
        "sub-law-basicrules-smoking-",
        "sub-law-basicrules-noise-",

    ];

    for (var i = 0; i < pages.length; i++) {
        loadOptimizedImage(
            document.getElementById("img-" + pages[i] + lang)
        );
    }
}

function idleRun(fn) {
    if ("requestIdleCallback" in window) {
        requestIdleCallback(fn, { timeout: 1200 });
    } else {
        setTimeout(fn, 250);
    }
}

function scheduleSmartPrefetch(pageId) {
    if (!canSmartPrefetch()) return;

    idleRun(function() {
        /* 언어 MAIN 화면 진입 후 자주 쓰는 3개 메뉴를 먼저 준비 */
        if (["kr","en","jp","cn","vn","mn","ph","ru","id","uz","th","kh","mm","tl","np","tr"].indexOf(pageId) >= 0) {
            prefetchPage("sub-hospital-" + currentLang);
            prefetchPage("sub-pharmacy-" + currentLang);
            prefetchPage("sub-safe-" + currentLang);
            prefetchPage("sub-law-" + currentLang);
        }

        /* 병원 화면에서는 의료정보를 미리 준비 */
        if (pageId === "sub-hospital-" + currentLang) {
            prefetchPage("sub-medinfo-" + currentLang);
        }


        /* 한국어 안전지원 화면에서는 상세 2개 이미지를 즉시 미리 로딩 */
        if (pageId === "sub-safe-kr") {
            loadOptimizedImage(document.getElementById("img-sub-safe-missing-kr"));
            loadOptimizedImage(document.getElementById("img-sub-safe-law-kr"));
        }
    });
}

/* 사용자가 누르기 시작하는 순간 다음 화면 다운로드를 바로 시작 */
document.addEventListener("pointerdown", function(e) {
    var el = e.target.closest("[data-prefetch-page]");
    if (!el) return;
    prefetchPage(el.getAttribute("data-prefetch-page"));
}, { passive: true });

        langSelect.value = currentLang;
    }

    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
    loadSafeTalkMessages();
    return false;
}

function closeSafeTalk(event) {
    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }
    var overlay = document.getElementById("safeTalkOverlay");
    if (overlay) overlay.classList.remove("open");
    document.body.style.overflow = "";
    return false;
}

function safeTalkOverlayClick(event) {
    if (event && event.target && event.target.id === "safeTalkOverlay") {
        closeSafeTalk(event);
    }
}

function updateSafeTalkCounter() {
    var el = document.getElementById("safeTalkMessage");
    var counter = document.getElementById("safeTalkCounter");
    if (el && counter) counter.textContent = el.value.length + " / 500";
}

function escapeSafeTalkHtml(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function safeTalkLanguageName(code) {
    var names = { kr: "한국어", en: "English", jp: "日本語", cn: "中文", vn: "Tiếng Việt", mn: "Монгол", ph: "Filipino", ru: "Русский", id: "Indonesia", uz: "O‘zbekcha", th: "ไทย", kh: "ខ្មែរ", mm: "မြန်မာ", tl: "Tagalog", np: "नेपाली", tr: "Türkçe" };
    return names[code] || code || "";
}

async function submitSafeTalk(event) {
    event.preventDefault();
    event.stopPropagation();

    var nickname = document.getElementById("safeTalkNickname").value.trim();
    var language = document.getElementById("safeTalkLanguage").value;
    var message = document.getElementById("safeTalkMessage").value.trim();
    var consent = document.getElementById("safeTalkConsent").checked;
    var status = document.getElementById("safeTalkStatus");
    var button = document.getElementById("safeTalkSubmit");

    if (!nickname || nickname.length > 30 || !message || message.length > 500 || !consent) {
        status.textContent = "Please complete all fields.";
        return false;
    }

    button.disabled = true;
    status.textContent = "Submitting...";

    try {
        var response = await fetch(
            SAFE_TALK_URL + "/rest/v1/safe_talk_reviews",
            {
                method: "POST",
                headers: safeTalkHeaders(true),
                body: JSON.stringify({
                    nickname: nickname,
                    language: language,
                    message: message,
                    status: "pending"
                })
            }
        );

        if (!response.ok) {
            var detail = await response.text();
            console.error("Safe Talk POST failed:", response.status, detail);
            throw new Error(detail || ("HTTP " + response.status));
        }

        document.getElementById("safeTalkMessage").value = "";
        document.getElementById("safeTalkConsent").checked = false;
        updateSafeTalkCounter();
        status.textContent = "Submitted. It will appear after administrator approval.";
    } catch (err) {
        console.error("Safe Talk submit error:", err);
        status.textContent = "Could not submit. Please try again.";
    } finally {
        button.disabled = false;
    }

    return false;
}

async function loadSafeTalkMessages() {
    var list = document.getElementById("safeTalkList");
    if (!list) return;
    list.innerHTML = '<div class="safe-talk-empty">Loading...</div>';

    try {
        var url = SAFE_TALK_URL +
            "/rest/v1/safe_talk_reviews" +
            "?select=nickname,language,message,created_at" +
            "&status=eq.approved" +
            "&order=created_at.desc" +
            "&limit=20";

        var response = await fetch(url, {
            method: "GET",
            headers: safeTalkHeaders(false)
        });

        if (!response.ok) {
            var detail = await response.text();
            throw new Error(detail || ("HTTP " + response.status));
        }

        var rows = await response.json();

        if (!rows.length) {
            list.innerHTML = '<div class="safe-talk-empty">No approved messages yet.</div>';
            return;
        }

        list.innerHTML = rows.map(function(row) {
            var dateText = "";
            try {
                dateText = new Date(row.created_at).toLocaleDateString();
            } catch (e) {}

            return '<div class="safe-talk-card">' +
                '<div class="safe-talk-card-top">' +
                    '<strong>' + escapeSafeTalkHtml(row.nickname) + '</strong>' +
                    '<span>' + escapeSafeTalkHtml(safeTalkLanguageName(row.language)) +
                    (dateText ? " · " + escapeSafeTalkHtml(dateText) : "") + '</span>' +
                '</div>' +
                '<div class="safe-talk-card-message">' +
                    escapeSafeTalkHtml(row.message) +
                '</div>' +
            '</div>';
        }).join("");
    } catch (err) {
        console.error("Safe Talk load error:", err);
        list.innerHTML = '<div class="safe-talk-empty">Could not load messages.</div>';
    }
}

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") closeSafeTalk();
});

</script>
