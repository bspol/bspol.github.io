<style>

/* ==================================================

html,

</head>


<body>


<!-- ==================================================
     영어 메인 화면
     ★ home.png 아님
     ★ main_en.png
     ================================================== -->

<div class="home-container">

    <img
        src="main_en.png"
        class="home-image"
        alt="BUSAN SAFETY GUIDE"
    >


    <!-- ==================================================
         왼쪽 상단 English 터치
         ================================================== -->

    <button
        id="languageTrigger"
        type="button"
        aria-label="Select language">
    </button>


    <!-- ==================================================
         하단 긴급신고
         ================================================== -->

    <button
        id="call112"
        type="button"
        aria-label="112">
    </button>

    <button
        id="call119"
        type="button"
        aria-label="119">
    </button>

    <button
        id="call1330"
        type="button"
        aria-label="1330">
    </button>


    <!-- ==================================================
         병원 / 약국
         ================================================== -->

    <button
        id="hospitalButton"
        type="button"
        aria-label="Hospital">
    </button>

    <button
        id="pharmacyButton"
        type="button"
        aria-label="Pharmacy">
    </button>

</div>


<!-- ==================================================
     언어창 바깥 닫기
     ================================================== -->

<div id="languageClose"></div>


<!-- ==================================================
     7개 언어
     한국어 제외
     ================================================== -->

<div id="languageMenu">

    <div class="language-title">
        Select Language
    </div>


    <!-- English -->

    <button
        type="button"
        class="language-button"
        data-url="main_en/">
        English
    </button>


    <!-- Chinese -->

    <button
        type="button"
        class="language-button"
        data-url="main_cn/">
        中文
    </button>


    <!-- Japanese -->

    <button
        type="button"
        class="language-button"
        data-url="main_jp/">
        日本語
    </button>


    <!-- Vietnamese -->

    <button
        type="button"
        class="language-button"
        data-url="main_vn/">
        Tiếng Việt
    </button>


    <!-- Mongolian -->

    <button
        type="button"
        class="language-button"
        data-url="main_mn/">
        Монгол
    </button>


    <!-- Filipino -->

    <button
        type="button"
        class="language-button"
        data-url="main_ph/">
        Filipino
    </button>


    <!-- Russian -->

    <button
        type="button"
        class="language-button"
        data-url="main_ru/">
        Русский
    </button>

</div>


<script>

/* ==================================================
   언어 메뉴
   ================================================== */

const trigger =
    document.getElementById("languageTrigger");

const menu =
    document.getElementById("languageMenu");

const closeArea =
    document.getElementById("languageClose");


/* ==================================================
   언어창 열기 / 닫기
   ================================================== */

trigger.addEventListener("click", function(e) {

    e.preventDefault();
    e.stopPropagation();

    if (menu.style.display === "block") {

        menu.style.display = "none";
        closeArea.style.display = "none";

    } else {

        menu.style.display = "block";
        closeArea.style.display = "block";

    }

});


/* ==================================================
   바깥을 누르면 닫기
   ================================================== */

closeArea.addEventListener("click", function(e) {

    e.preventDefault();

    menu.style.display = "none";
    closeArea.style.display = "none";

});


/* ==================================================
   언어 선택
   ★ ../ 제거
   ================================================== */

document
.querySelectorAll(".language-button")
.forEach(function(button) {

    button.addEventListener("click", function(e) {

        e.preventDefault();
        e.stopPropagation();

        const url =
            this.getAttribute("data-url");

        if (url) {

            window.location.href = url;

        }

    });

});


/* ==================================================
   112
   ================================================== */

document
.getElementById("call112")
.addEventListener("click", function() {

    window.location.href = "tel:112";

});


/* ==================================================
   119
   ================================================== */

document
.getElementById("call119")
.addEventListener("click", function() {

    window.location.href = "tel:119";

});


/* ==================================================
   1330
   ================================================== */

document
.getElementById("call1330")
.addEventListener("click", function() {

    window.location.href = "tel:1330";

});


/* ==================================================
   병원
   ================================================== */

document
.getElementById("hospitalButton")
.addEventListener("click", function() {

    window.location.href = "hospital_en/";

});


/* ==================================================
   약국
   ================================================== */

document
.getElementById("pharmacyButton")
.addEventListener("click", function() {

    window.location.href = "pharmacy_en/";

});


/* ==================================================
   ESC 닫기
   ================================================== */

document.addEventListener("keydown", function(e) {

    if (e.key === "Escape") {

        menu.style.display = "none";
        closeArea.style.display = "none";

    }

});

</script>


</body>

</html>
