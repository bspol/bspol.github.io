<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Safe in Busan</title>

<style>

/* ================================
   기본 설정
   ================================ */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #fff;

    overflow-x: hidden;
}

* {
    box-sizing: border-box;
}


/* ================================
   전체 이미지 영역
   ================================ */

.page-container {
    position: relative;

    width: 100%;
    margin: 0;
    padding: 0;

    line-height: 0;
}


/* ================================
   HOME 이미지
   ================================ */

.page-image {
    display: block;

    width: 100%;
    height: auto;

    margin: 0;
    padding: 0;

    border: 0;

    user-select: none;
    -webkit-user-drag: none;
}


/* ================================
   HOSPITAL 버튼
   ================================

   home.png 실제 위치:
   왼쪽 첫 번째 아이콘

   버튼은 투명하게 만들어서
   이미지 위에 터치 영역만 올립니다.
   ================================ */

#hospitalButton {

    position: absolute;

    left: 4%;

    top: 40.5%;

    width: 18%;

    height: 10.5%;

    border: none;

    background: transparent;

    padding: 0;

    margin: 0;

    z-index: 1000;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


/* ================================
   PC에서 마우스로 눌렀을 때
   살짝 표시

   평소에는 완전히 투명합니다.
   ================================ */

#hospitalButton:active {
    background: rgba(0, 0, 0, 0.05);
}

</style>

</head>


<body>


<div class="page-container">


    <!-- ============================
         HOME 화면
         ============================ -->

    <img
        src="home.png"
        class="page-image"
        alt="Safe in Busan"
    >


    <!-- ============================
         HOSPITAL 버튼
         ============================ -->

    <button
        id="hospitalButton"
        type="button"
        aria-label="Hospital">
    </button>


</div>


<script>

/* ================================
   HOSPITAL
   ================================ */

document
.getElementById("hospitalButton")
.addEventListener("click", function () {

    window.location.href = "hospital.html";

});

</script>


</body>

</html>
