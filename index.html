<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Busan Foreigner Safety Platform</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b1d3a;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 20px;
        }
        .main-img {
            width: 100%;
            height: auto;
            display: none;
        }
        .main-img.active {
            display: block;
        }
        
        /* 터치 링크 설정 */
        .touch-link {
            position: absolute;
            cursor: pointer;
            display: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            pointer-events: auto;
            box-sizing: border-box;
            background-color: transparent !important;
            border: none !important;
            z-index: 999999 !important;
        }

        /* 1. 홈 화면 */
        .btn-en { top: 54.0%; left: 6.5%; width: 87.0%; height: 5.2%; }
        .btn-cn { top: 60.0%; left: 6.5%; width: 87.0%; height: 5.2%; }
        .btn-jp { top: 66.0%; left: 6.5%; width: 87.0%; height: 5.2%; }
        .btn-vn { top: 72.0%; left: 6.5%; width: 87.0%; height: 5.2%; }

        .home-phone { top: 82.5%; height: 7.5%; }
        .home-112 { left: 6.5%; width: 27.5%; }
        .home-119 { left: 36.2%; width: 27.5%; }
        .home-1330 { left: 66.0%; width: 27.5%; }

        /* 2. 상단 지구본 드롭다운 버튼 */
        .btn-lang-dropdown { top: 1.5%; left: 2.5%; width: 26.0%; height: 5.5%; } 

        /* 3. 언어 메인 화면 - 상단 CALL 버튼 3개 */
        .main-call-112  { top: 38.5%; left: 3.5%; width: 29.5%; height: 10.0%; }
        .main-call-119  { top: 38.5%; left: 35.2%; width: 29.5%; height: 10.0%; }
        .main-call-1330 { top: 38.5%; left: 67.0%; width: 29.5%; height: 10.0%; }

        /* 4. 언어 메인 화면 - 6대 카드 메뉴 */
        .click-hospital  { top: 51.5%; left: 3.0%; width: 46.5%; height: 12.5%; }
        .click-pharmacy  { top: 51.5%; left: 50.5%; width: 46.5%; height: 12.5%; }
        .click-embassy   { top: 65.5%; left: 3.0%; width: 46.5%; height: 12.5%; }
        .click-lost      { top: 65.5%; left: 50.5%; width: 46.5%; height: 12.5%; }
        .click-rules     { top: 79.5%; left: 3.0%; width: 46.5%; height: 12.5%; }
        .click-spots     { top: 79.5%; left: 50.5%; width: 46.5%; height: 12.5%; }

        /* 5. 약국 페이지 버튼 */
        .pharm-call-112  { top: 41.5%; left: 3.5%; width: 22.0%; height: 9.0%; }
        .pharm-call-119  { top: 41.5%; left: 27.5%; width: 22.0%; height: 9.0%; }
        .pharm-call-1330 { top: 41.5%; left: 51.5%; width: 22.0%; height: 9.0%; }
        .pharm-late-link { top: 41.5%; left: 75.5%; width: 22.0%; height: 9.0%; }

        /* 6. 병원 페이지 버튼 */
        .hosp-call-112   { top: 45.0%; left: 5.0%; width: 28.0%; height: 9.5%; }
        .hosp-call-119   { top: 45.0%; left: 36.0%; width: 28.0%; height: 9.5%; }
        .hosp-call-1330  { top: 45.0%; left: 67.0%; width: 28.0%; height: 9.5%; }

        .hosp-find-map   { top: 61.5%; left: 4.5%; width: 29.0%; height: 23.0%; }
        .hosp-emergency  { top: 61.5%; left: 35.5%; width: 29.0%; height: 23.0%; }
        .hosp-medinfo    { top: 61.5%; left: 66.5%; width: 29.0%; height: 23.0%; }

        /* 7. 의료정보 페이지 하단 전화 버튼 */
        .med-call-112    { top: 89.0%; left: 5.5%; width: 29.0%; height: 8.5%; }
        .med-call-119    { top: 89.0%; left: 35.5%; width: 29.0%; height: 8.5%; }
        .med-call-1330   { top: 89.0%; left: 65.5%; width: 29.0%; height: 8.5%; }

        /* 8. 기초질서 페이지 하단 긴급신고 버튼 */
        .rules-call-112  { top: 82.2%; left: 6.5%; width: 27.5%; height: 6.5%; }
        .rules-call-119  { top: 82.2%; left: 36.2%; width: 27.5%; height: 6.5%; }
        .rules-call-1330 { top: 82.2%; left: 66.0%; width: 27.5%; height: 6.5%; }

        /* 영사관 페이지 하단 긴급전화 버튼 전용 스타일 */
        .emb-call-112  { top: 89.8%; left: 29.5%; width: 20.2%; height: 8.5%; }
        .emb-call-119  { top: 89.8%; left: 49.8%; width: 20.2%; height: 8.5%; }
        .emb-call-1330 { top: 89.8%; left: 70.2%; width: 27.0%; height: 8.5%; }

        /* 9. 영사관 페이지 11개국 버튼 스타일 (너비와 높이를 더 넓게 확장) */
        .emb-btn-call {
            position: absolute;
            display: none;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            z-index: 99999999 !important;
            box-sizing: border-box;
            background: transparent;
            border: none;
        }
        .emb-btn-home {
            position: absolute;
            display: none;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            z-index: 99999999 !important;
            box-sizing: border-box;
            background: transparent;
            border: none;
        }

        .emb-back-btn { top: 1.5%; left: 2.0%; width: 22.0%; height: 4.5%; }
        .med-back-btn { top: 1.5%; right: 2.0%; left: auto; width: 22.0%; height: 4.5%; }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 7.5%; 
            left: 2.5%;
            width: 150px;
            background-color: #12284c;
            border: 1px solid #234375;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            z-index: 9999999;
            padding: 5px 0;
        }
        .dropdown-menu a {
            display: block;
            color: #ffffff;
            padding: 12px 15px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #1c3966;
        }
    </style>
</head>
<body>

        <a id="rules-1330" href="tel:1330" class="touch-link rules-call-1330"></a>

        <!-- 영사관 페이지 하단 긴급전화 버튼 -->
        <a id="emb-112" href="tel:112" class="touch-link emb-call-112"></a>
        <a id="emb-119" href="tel:119" class="touch-link emb-call-119"></a>

        <a id="emb-back" href="javascript:void(0)" class="touch-link emb-back-btn" onclick="goPage(currentLang)"></a>
        <a id="med-back" href="javascript:void(0)" class="touch-link med-back-btn" onclick="goPage('sub-hospital-' + currentLang)"></a>

        <!-- 영사관 11개 나라별 버튼 영역 확장 (전화하기 / 홈페이지 텍스트 및 커서 변경 영역을 감싸도록 넓힘) -->

        <a id="e2-home" href="http://busan.china-consulate.gov.cn/kor/" target="_blank" class="emb-btn-home" style="top: 35.2%; left: 52.2%; width: 15.5%; height: 4.5%;"></a>

        <a id="e3-call" href="tel:051-715-8689" class="emb-btn-call" style="top: 35.2%; left: 68.5%; width: 15.5%; height: 4.5%;"></a>
        <a id="e3-home" href="https://vnembassy-seoul.mofa.gov.vn/en-us/Pages/default.aspx" target="_blank" class="emb-btn-home" style="top: 35.2%; left: 84.2%; width: 15.5%; height: 4.5%;"></a>

        <!-- 4. 러시아 -->
        <a id="e4-call" href="tel:051-441-9904" class="emb-btn-call" style="top: 48.2%; left: 4.5%; width: 15.5%; height: 4.5%;"></a>
        <a id="e4-home" href="https://pusan.mid.ru" target="_blank" class="emb-btn-home" style="top: 48.2%; left: 20.2%; width: 15.5%; height: 4.5%;"></a>

        <!-- 5. 몽골 -->
        <a id="e5-call" href="tel:051-465-9996" class="emb-btn-call" style="top: 48.2%; left: 36.5%; width: 15.5%; height: 4.5%;"></a>
        <a id="e5-home" href="https://busan.consul.mn" target="_blank" class="emb-btn-home" style="top: 48.2%; left: 52.2%; width: 15.5%; height: 4.5%;"></a>

        <!-- 6. 타이베이 -->

    <script>
        var currentLang = 'en';

        function setDisplay(id, show) {
            var el = document.getElementById(id);
            if (el) el.style.display = show ? 'block' : 'none';
        }

        function goPage(pageId) {
            if (!pageId) return;

            var dropdown = document.getElementById('langDropdown');
            if (dropdown) dropdown.style.display = 'none';

            var images = document.getElementsByClassName('main-img');
            for (var i = 0; i < images.length; i++) {
                images[i].classList.remove('active');
            }

            var targetImg = document.getElementById('img-' + pageId);
            if (targetImg) targetImg.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (pageId === 'en' || pageId === 'cn' || pageId === 'jp' || pageId === 'vn') {
                currentLang = pageId;
            }

            var isHome = (pageId === 'home');
            var isMainLang = (pageId === 'en' || pageId === 'cn' || pageId === 'jp' || pageId === 'vn');
            var isPharmacySub = pageId.indexOf('pharmacy') !== -1;
            var isHospitalSub = pageId.indexOf('hospital') !== -1;
            var isMedInfoSub = pageId.indexOf('medinfo') !== -1;
            var isEmbassySub = (pageId === 'sub-embassy');
            var isRulesSub = (pageId === 'sub-rules');

            setDisplay('area-en', isHome);
            setDisplay('area-cn', isHome);
            setDisplay('area-jp', isHome);
            setDisplay('area-vn', isHome);
            setDisplay('h-112', isHome);
            setDisplay('h-119', isHome);
            setDisplay('h-1330', isHome);

            setDisplay('area-lang-dropdown', !isHome);

            setDisplay('m-112', isMainLang);
            setDisplay('m-119', isMainLang);
            setDisplay('m-1330', isMainLang);
            setDisplay('click-hosp', isMainLang);
            setDisplay('click-phar', isMainLang);
            setDisplay('click-emba', isMainLang);
            setDisplay('click-lost', isMainLang);
            setDisplay('click-rule', isMainLang);
            setDisplay('click-spots', isMainLang);

            setDisplay('p-112', isPharmacySub);
            setDisplay('p-119', isPharmacySub);
            setDisplay('p-1330', isPharmacySub);
            setDisplay('p-late', isPharmacySub);

            setDisplay('hp-112', isHospitalSub);
            setDisplay('hp-119', isHospitalSub);
            setDisplay('hp-1330', isHospitalSub);
            setDisplay('hp-find', isHospitalSub);
            setDisplay('hp-emer', isHospitalSub);
            setDisplay('hp-med', isHospitalSub);

            setDisplay('med-112', isMedInfoSub);
            setDisplay('med-119', isMedInfoSub);
            setDisplay('med-1330', isMedInfoSub);

            setDisplay('rules-112', isRulesSub);
            setDisplay('rules-119', isRulesSub);
            setDisplay('rules-1330', isRulesSub);

            setDisplay('emb-112', isEmbassySub);
            setDisplay('emb-119', isEmbassySub);
            setDisplay('emb-1330', isEmbassySub);

            setDisplay('emb-back', isEmbassySub);
            setDisplay('med-back', isMedInfoSub);

            for (var i = 1; i <= 11; i++) {
                setDisplay('e' + i + '-call', isEmbassySub);
                setDisplay('e' + i + '-home', isEmbassySub);
            }
        }

        function toggleDropdown(event) {
            if (event) event.stopPropagation(); 
            var dropdown = document.getElementById('langDropdown');
            if (dropdown) dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
        }

        document.addEventListener('click', function(e) {
            var dropdown = document.getElementById('langDropdown');
            var dropdownBtn = document.getElementById('area-lang-dropdown');
            if (dropdown && e.target !== dropdownBtn && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        function clickSubMenu(type) {
            if (type === 'hospital') {
                goPage('sub-hospital-' + currentLang);
            } else if (type === 'pharmacy') {
                goPage('sub-pharmacy-' + currentLang);
            }
        }

        window.onload = function() {
            goPage('home');
        };
    </script>

</body>
</html>
