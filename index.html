<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>SAFE IN BUSAN</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 1080px;
    max-height: 1920px;
    margin: auto;
    overflow: hidden;
}

.screen {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.screen img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}

.touch {
    position: absolute;
    background: transparent;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    z-index: 20;
}

/* =========================
   메인 화면
   ========================= */

.main-language-button {
    left: 0%;
    top: 0%;
    width: 35%;
    height: 10%;
}

.main-112 {
    left: 2%;
    top: 32.3%;
    width: 31%;
    height: 13.7%;
}

.main-119 {
    left: 34%;
    top: 32.3%;
    width: 31%;
    height: 13.7%;
}

.main-1330 {
    left: 66%;
    top: 32.3%;
    width: 32%;
    height: 13.7%;
}

.main-hospital {
    left: 2%;
    top: 47%;
    width: 47.8%;
    height: 16.8%;
}

.main-pharmacy {
    left: 50.2%;
    top: 47%;
    width: 47.8%;
    height: 16.8%;
}


/* =========================
   병원 화면
   ========================= */

#hospitalPage {
    display: none;
}

.hospital-language-button {
    left: 0%;
    top: 0%;
    width: 35%;
    height: 10%;
}

.hospital-112 {
    left: 4%;
    top: 45%;
    width: 28%;
    height: 14%;
}

.hospital-119 {
    left: 36%;
    top: 45%;
    width: 28%;
    height: 14%;
}

.hospital-1330 {
    left: 68%;
    top: 45%;
    width: 28%;
    height: 14%;
}

.find-hospital {
    left: 4%;
    top: 61%;
    width: 28%;
    height: 26%;
}

.find-emergency {
    left: 36%;
    top: 61%;
    width: 28%;
    height: 26%;
}

.medical-info {
    left: 68%;
    top: 61%;
    width: 28%;
    height: 26%;
}


/* =========================
   언어 선택 메뉴
   ========================= */

#languageMenu {
    position: absolute;
    display: none;

    left: 5%;
    top: 8%;
    width: 90%;

    background: rgba(255,255,255,0.97);

    border-radius: 20px;
    padding: 20px;

    z-index: 1000;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.4);
}

.language-title {
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 15px;
}

.language-button {
    display: block;

    width: 100%;
    min-height: 60px;

    margin-bottom: 10px;

    border: none;
    border-radius: 12px;

    background: #f0f0f0;

    font-size: 21px;
    font-weight: bold;

    cursor: pointer;
}

.language-button:last-child {
    margin-bottom: 0;
}

.language-button:active {
    transform: scale(0.98);
}


/* 메뉴 바깥 닫기 */

#languageClose {
    position: fixed;
    inset: 0;

    display: none;

    background: rgba(0,0,0,0.35);

    z-index: 900;
}

</style>

</head>


<body>

<div id="app">


    <!-- =========================
         메인 화면
         ========================= -->

    <div id="mainPage" class="screen">

        <img id="mainImage"
             src="./main_en.png"
             alt="SAFE IN BUSAN">


        <!-- 언어 선택 -->

        <button
            type="button"
            class="touch main-language-button"
            onclick="openLanguageMenu()"
            aria-label="Select language">
        </button>


        <!-- 112 -->

        <a
            class="touch main-112"
            href="tel:112"
            aria-label="112">
        </a>


        <!-- 119 -->

        <a
            class="touch main-119"
            href="tel:119"
            aria-label="119">
        </a>


        <!-- 1330 -->

        <a
            class="touch main-1330"
            href="tel:1330"
            aria-label="1330">
        </a>


        <!-- 병원 -->

        <button
            type="button"
            class="touch main-hospital"
            onclick="openHospital()"
            aria-label="Hospital">
        </button>


        <!-- 약국 -->

        <a
            id="pharmacyButton"
            class="touch main-pharmacy"
            href="./pharmacy_en.png"
            aria-label="Pharmacy">
        </a>

    </div>



    <!-- =========================
         병원 화면
         ========================= -->

    <div id="hospitalPage" class="screen">

        <img id="hospitalImage"
             src="./hospital_en.png"
             alt="Hospital">


        <!-- 언어 선택 -->

        <button
            type="button"
            class="touch hospital-language-button"
            onclick="openLanguageMenu()"
            aria-label="Select language">
        </button>


        <!-- 112 -->

        <a
            class="touch hospital-112"
            href="tel:112"
            aria-label="112">
        </a>


        <!-- 119 -->

        <a
            class="touch hospital-119"
            href="tel:119"
            aria-label="119">
        </a>


        <!-- 1330 -->

        <a
            class="touch hospital-1330"
            href="tel:1330"
            aria-label="1330">
        </a>


        <!-- 병원 찾기 -->

        <button
            type="button"
            class="touch find-hospital"
            onclick="findHospital()"
            aria-label="Find hospital">
        </button>


        <!-- 응급실 찾기 -->

        <button
            type="button"
            class="touch find-emergency"
            onclick="findEmergency()"
            aria-label="Find emergency room">
        </button>


        <!-- 의료정보 -->

        <button
            type="button"
            class="touch medical-info"
            onclick="openMedicalInfo()"
            aria-label="Medical information">
        </button>

    </div>



    <!-- =========================
         언어 선택 배경
         ========================= -->

    <div id="languageClose"
         onclick="closeLanguageMenu()">
    </div>



    <!-- =========================
         언어 선택 메뉴
         ========================= -->

    <div id="languageMenu">

        <div class="language-title">
            Select Language
        </div>


        <button
            type="button"
            class="language-button"
            onclick="selectLanguage('en')">
            English
        </button>


        <button
            type="button"
            class="language-button"
            onclick="selectLanguage('jp')">
            日本語
        </button>


        <button
            type="button"
            class="language-button"
            onclick="selectLanguage('cn')">
            中文
        </button>


        <button
            type="button"
            class="language-button"
            onclick="selectLanguage('ru')">
            Русский
        </button>


        <button
            type="button"
            class="language-button"
            onclick="selectLanguage('vn')">
            Tiếng Việt
        </button>


        <button
            type="button"
            class="language-button"
            onclick="selectLanguage('mn')">
            Монгол
        </button>


        <button
            type="button"
            class="language-button"
            onclick="selectLanguage('ph')">
            Filipino
        </button>

    </div>

</div>



<script>

/* ==================================================
   나라별 PNG 설정
   ================================================== */

const languages = {

    en: {
        main: "./main_en.png",
        hospital: "./hospital_en.png",
        pharmacy: "./pharmacy_en.png",
        medical: "./medical-info-en.png"
    },

    jp: {
        main: "./main_jp.png",
        hospital: "./hospital_jp.png",
        pharmacy: "./pharmacy_jp.png",
        medical: "./medical-info-jp.png"
    },

    cn: {
        main: "./main_cn.png",
        hospital: "./hospital_cn.png",
        pharmacy: "./pharmacy_cn.png",
        medical: "./medical-info-cn.png"
    },

    ru: {
        main: "./main_ru.png",
        hospital: "./hospital_ru.png",
        pharmacy: "./pharmacy_ru.png",
        medical: "./medical-info-ru.png"
    },

    vn: {
        main: "./main_vn.png",
        hospital: "./hospital_vn.png",
        pharmacy: "./pharmacy_vn.png",
        medical: "./medical-info-vn.png"
    },

    mn: {
        main: "./main_mn.png",
        hospital: "./hospital_mn.png",
        pharmacy: "./pharmacy_mn.png",
        medical: "./medical-info-mn.png"
    },

    ph: {
        main: "./main_ph.png",
        hospital: "./hospital_ph.png",
        pharmacy: "./pharmacy_ph.png",
        medical: "./medical-info-ph.png"
    }

};


/* ==================================================
   현재 언어
   ================================================== */

let currentLanguage = "en";


/* ==================================================
   언어 메뉴 열기
   ================================================== */

function openLanguageMenu() {

    document.getElementById("languageClose").style.display = "block";

    document.getElementById("languageMenu").style.display = "block";
}


/* ==================================================
   언어 메뉴 닫기
   ================================================== */

function closeLanguageMenu() {

    document.getElementById("languageClose").style.display = "none";

    document.getElementById("languageMenu").style.display = "none";
}


/* ==================================================
   나라 선택
   ================================================== */

function selectLanguage(lang) {

    /*
       존재하지 않는 나라면 중단
    */

    if (!languages[lang]) {
        console.error("존재하지 않는 언어:", lang);
        return;
    }


    /*
       현재 언어 저장
    */

    currentLanguage = lang;


    /*
       선택한 나라의 파일 가져오기
    */

    const data = languages[currentLanguage];


    /*
       MAIN PNG 변경

       예:
       en → main_en.png
       jp → main_jp.png
       cn → main_cn.png
       ru → main_ru.png
       vn → main_vn.png
       mn → main_mn.png
       ph → main_ph.png
    */

    document.getElementById("mainImage").src = data.main;


    /*
       병원 PNG도 같은 나라로 변경
    */

    document.getElementById("hospitalImage").src = data.hospital;


    /*
       약국 PNG도 같은 나라로 변경
    */

    document.getElementById("pharmacyButton").href = data.pharmacy;


    /*
       메뉴 닫기
    */

    closeLanguageMenu();


    /*
       나라를 선택하면
       항상 해당 나라의 MAIN 화면으로 이동
    */

    document.getElementById("hospitalPage").style.display = "none";

    document.getElementById("mainPage").style.display = "block";

}


/* ==================================================
   병원 화면 열기
   ================================================== */

function openHospital() {

    const data = languages[currentLanguage];


    /*
       현재 선택된 나라의 병원 PNG
    */

    document.getElementById("hospitalImage").src =
        data.hospital;


    /*
       MAIN 숨기기
    */

    document.getElementById("mainPage").style.display =
        "none";


    /*
       병원 화면 표시
    */

    document.getElementById("hospitalPage").style.display =
        "block";

}


/* ==================================================
   약국
   ================================================== */

function openPharmacy() {

    const data = languages[currentLanguage];

    window.location.href = data.pharmacy;

}


/* ==================================================
   병원 찾기
   ================================================== */

function findHospital() {

    window.open(
        "https://www.google.com/maps/search/?api=1&query=hospital+near+me",
        "_blank"
    );

}


/* ==================================================
   응급실 찾기
   ================================================== */

function findEmergency() {

    window.open(
        "https://www.google.com/maps/search/?api=1&query=emergency+room+near+me",
        "_blank"
    );

}


/* ==================================================
   의료정보
   ================================================== */

function openMedicalInfo() {

    const data = languages[currentLanguage];

    window.location.href = data.medical;

}


/* ==================================================
   초기화
   ================================================== */

document.addEventListener("DOMContentLoaded", function() {

    /*
       처음에는 영어 MAIN
    */

    currentLanguage = "en";


    /*
       MAIN 화면 표시
    */

    document.getElementById("mainPage").style.display =
        "block";


    /*
       병원 화면 숨김
    */

    document.getElementById("hospitalPage").style.display =
        "none";


    /*
       영어 이미지 적용
    */

    document.getElementById("mainImage").src =
        languages.en.main;

    document.getElementById("hospitalImage").src =
        languages.en.hospital;

    document.getElementById("pharmacyButton").href =
        languages.en.pharmacy;

});

</script>

</body>
</html>
