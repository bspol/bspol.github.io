<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no">

<title>SAFE IN BUSAN</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    position: relative;

    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7778vw);

    max-width: 1080px;
    max-height: 1920px;

    aspect-ratio: 1080 / 1920;

    overflow: hidden;

    background: #fff;
}

#mainImage {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    display: block;

    user-select: none;
    -webkit-user-drag: none;

    z-index: 1;
}

.touch-button {
    position: absolute;

    display: block;

    z-index: 20;

    background: transparent;

    border: none;
    outline: none;

    text-decoration: none;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


/* ==========================
   MAIN - 112
   ========================== */

.call112 {
    left: 2%;
    top: 32.3%;
    width: 31%;
    height: 13.7%;
}


/* ==========================
   MAIN - 119
   ========================== */

.call119 {
    left: 34%;
    top: 32.3%;
    width: 31%;
    height: 13.7%;
}


/* ==========================
   MAIN - 1330
   ========================== */

.call1330 {
    left: 66%;
    top: 32.3%;
    width: 32%;
    height: 13.7%;
}


/* ==========================
   MAIN - HOSPITAL
   ========================== */

.hospital {
    left: 2%;
    top: 47.0%;
    width: 47.8%;
    height: 16.8%;
}


/* ==========================
   MAIN - PHARMACY
   ========================== */

.pharmacy {
    left: 50.2%;
    top: 47.0%;
    width: 47.8%;
    height: 16.8%;
}


/* ==========================
   HOSPITAL PAGE
   ========================== */

#hospitalPage {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: none;

    background: #fff;

    z-index: 100;
}

#hospitalImage {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    display: block;

    user-select: none;
    -webkit-user-drag: none;

    z-index: 101;
}


/* ==========================
   LANGUAGE BUTTON
   ========================== */

.language-button {
    position: absolute;

    left: 2.5%;
    top: 1.2%;

    width: 40%;
    height: 5.5%;

    padding: 0;

    border: none;

    background: transparent;

    color: white;

    display: flex;
    align-items: center;

    gap: 9px;

    font-size: clamp(15px, 2.5vw, 28px);

    text-align: left;

    cursor: pointer;

    z-index: 300;

    touch-action: manipulation;
}

.language-button .globe {
    font-size: clamp(27px, 3.8vw, 42px);
    line-height: 1;
}

.language-button .arrow {
    font-size: clamp(18px, 2.5vw, 28px);
    line-height: 1;
}


/* ==========================
   LANGUAGE MENU
   ========================== */

#languageMenu {
    position: absolute;

    left: 2.5%;
    top: 6.2%;

    width: 42%;

    background: #fff;

    border-radius: 14px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.30);

    overflow: hidden;

    display: none;

    z-index: 400;
}

#languageMenu.show {
    display: block;
}

#languageMenu button {
    display: block;

    width: 100%;

    min-height: 48px;

    padding: 12px 16px;

    border: none;

    border-bottom: 1px solid #eeeeee;

    background: #fff;

    color: #222;

    font-size: clamp(14px, 2vw, 21px);

    text-align: left;

    cursor: pointer;

    touch-action: manipulation;
}

#languageMenu button:last-child {
    border-bottom: none;
}

#languageMenu button:active {
    background: #eeeeee;
}


/* ==========================
   HOSPITAL BUTTONS
   ========================== */

.hospital-call112 {
    position: absolute;

    left: 4%;
    top: 45%;

    width: 28%;
    height: 14%;

    z-index: 250;
}

.hospital-call119 {
    position: absolute;

    left: 36%;
    top: 45%;

    width: 28%;
    height: 14%;

    z-index: 250;
}

.hospital-call1330 {
    position: absolute;

    left: 68%;
    top: 45%;

    width: 28%;
    height: 14%;

    z-index: 250;
}

.find-hospital {
    position: absolute;

    left: 4%;
    top: 61%;

    width: 28%;
    height: 26%;

    z-index: 250;
}

.find-emergency {
    position: absolute;

    left: 36%;
    top: 61%;

    width: 28%;
    height: 26%;

    z-index: 250;
}

.medical-information {
    position: absolute;

    left: 68%;
    top: 61%;

    width: 28%;
    height: 26%;

    z-index: 250;
}


/* ==========================
   PC
   ========================== */

@media (min-width: 1081px) {

    #app {
        width: 540px;
        height: 960px;
    }

}


/* ==========================
   MOBILE
   ========================== */

@media (max-width: 600px) {

    #app {
        width: 100vw;
        height: 100vh;
        aspect-ratio: auto;
    }

}

</style>

</head>

<body>

<div id="app">

```

<a

<!-- ==========================
     HOSPITAL PAGE
     ========================== -->

<div id="hospitalPage">


    <img
        id="hospitalImage"
        src="./hospital_en.png"
        alt="Hospital"
        draggable="false"
    >


    <!-- LANGUAGE BUTTON -->

    <button
        type="button"
        class="language-button"
        onclick="toggleLanguageMenu()">

        <button type="button"
                onclick="selectLanguage('en')">
            English

        <button type="button"
                onclick="selectLanguage('jp')">

        </button>

        <button type="button"
                onclick="selectLanguage('cn')">

        </button>

        <button type="button"
                onclick="selectLanguage('ru')">
            Русский
        </button>

        <button type="button"
                onclick="selectLanguage('vn')">
            Tiếng Việt
        </button>

        <button type="button"
                onclick="selectLanguage('mn')">

        </button>

        <button type="button"
                onclick="selectLanguage('ph')">

        </button>

    <!-- 112 -->

    <a
        href="tel:112"
        class="touch-button hospital-call112"

    <!-- 119 -->

    <a
        href="tel:119"
        class="touch-button hospital-call119"
        aria-label="119">

    <a
        href="tel:1330"
        class="touch-button hospital-call1330"

        aria-label="Medical Information">
    </a>


</div>
```

</div>

<script>

/* ==================================================
   현재 언어
   ================================================== */

let currentLanguage = "en";


/* ==================================================
   7개 언어 파일
   ================================================== */

const languageData = {

    en: {
        name: "English",
        main: "./main_en.png",
        hospital: "./hospital_en.png",
        pharmacy: "./pharmacy_en.png",
        medical: "./medical-info-en.png"
    },

    jp: {
        name: "日本語",
        main: "./main_jp.png",
        hospital: "./hospital_jp.png",
        pharmacy: "./pharmacy_jp.png",
        medical: "./medical-info-jp.png"
    },

    cn: {
        name: "中文",
        main: "./main_cn.png",
        hospital: "./hospital_cn.png",
        pharmacy: "./pharmacy_cn.png",
        medical: "./medical-info-cn.png"
    },

    ru: {
        name: "Русский",
        main: "./main_ru.png",
        hospital: "./hospital_ru.png",
        pharmacy: "./pharmacy_ru.png",
        medical: "./medical-info-ru.png"
    },

    vn: {
        name: "Tiếng Việt",
        main: "./main_vn.png",
        hospital: "./hospital_vn.png",
        pharmacy: "./pharmacy_vn.png",
        medical: "./medical-info-vn.png"
    },

    mn: {
        name: "Монгол хэл",
        main: "./main_mn.png",
        hospital: "./hospital_mn.png",
        pharmacy: "./pharmacy_mn.png",
        medical: "./medical-info-mn.png"
    },

    ph: {
        name: "Filipino",
        main: "./main_ph.png",
        hospital: "./hospital_ph.png",
        pharmacy: "./pharmacy_ph.png",
        medical: "./medical-info-ph.png"
    }

};


/* ==================================================
   병원 열기
   ================================================== */

function openHospital() {

    const data = languageData[currentLanguage];

    if (!data) return;


    document.getElementById(
        "hospitalImage"
    ).src = data.hospital;


    document.getElementById(
        "currentLanguage"
    ).textContent = data.name;


    document.getElementById(
        "medicalInformation"
    ).href = data.medical;


    document.getElementById(
        "mainImage"
    ).style.display = "none";


    document.getElementById(
        "hospitalPage"
    ).style.display = "block";


    document.getElementById(
        "languageMenu"
    ).classList.remove("show");

}


/* ==================================================
   언어 메뉴
   ================================================== */

function toggleLanguageMenu() {

    const menu =
        document.getElementById("languageMenu");

    menu.classList.toggle("show");

}


/* ==================================================
   언어 선택
   병원 → 해당 언어 MAIN
   ================================================== */

function selectLanguage(lang) {

    const data = languageData[lang];

    if (!data) return;

    currentLanguage = lang;


    document.getElementById(
        "hospitalPage"
    ).style.display = "none";


    document.getElementById(
        "mainImage"
    ).style.display = "block";


    document.getElementById(
        "mainImage"
    ).src = data.main;


    document.getElementById(
        "pharmacyButton"
    ).href = data.pharmacy;


    document.getElementById(
        "languageMenu"
    ).classList.remove("show");

}


/* ==================================================
   약국 열기
   ================================================== */

function openPharmacy() {

    const data = languageData[currentLanguage];

    if (!data || !data.pharmacy) return;

    window.location.href = data.pharmacy;

}


/* ==================================================
   시작
   ================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        currentLanguage = "en";

        document.getElementById(
            "mainImage"
        ).src = languageData.en.main;

        document.getElementById(
            "pharmacyButton"
        ).href = languageData.en.pharmacy;

        document.getElementById(
            "hospitalPage"
        ).style.display = "none";

    }
);

</script>

</body>

</html>
