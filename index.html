/* ==========================

   ========================== */

* {

    box-sizing: border-box;

}

html,
body {

    height: 100%;

}

    justify-content: center;

   ========================== */

#app {

</div>

<script>

/* ==================================================
   현재 언어
   ================================================== */

let currentLanguage = "en";


/* ==================================================
   7개 언어 파일
   ================================================== */

const languageData = {

    en: {
        name: "English",
        main: "./main_en.png",
        hospital: "./hospital_en.png",
        pharmacy: "./pharmacy_en.png",
        medical: "./medical-info-en.png"
    },

    jp: {
        name: "日本語",
        main: "./main_jp.png",
        hospital: "./hospital_jp.png",
        pharmacy: "./pharmacy_jp.png",
        medical: "./medical-info-jp.png"
    },

    cn: {
        name: "中文",
        main: "./main_cn.png",
        hospital: "./hospital_cn.png",
        pharmacy: "./pharmacy_cn.png",
        medical: "./medical-info-cn.png"
    },

    ru: {
        name: "Русский",
        main: "./main_ru.png",
        hospital: "./hospital_ru.png",
        pharmacy: "./pharmacy_ru.png",
        medical: "./medical-info-ru.png"
    },

    vn: {
        name: "Tiếng Việt",
        main: "./main_vn.png",
        hospital: "./hospital_vn.png",
        pharmacy: "./pharmacy_vn.png",
        medical: "./medical-info-vn.png"
    },

    mn: {
        name: "Монгол хэл",
        main: "./main_mn.png",
        hospital: "./hospital_mn.png",
        pharmacy: "./pharmacy_mn.png",
        medical: "./medical-info-mn.png"
    },

    ph: {
        name: "Filipino",
        main: "./main_ph.png",
        hospital: "./hospital_ph.png",
        pharmacy: "./pharmacy_ph.png",
        medical: "./medical-info-ph.png"
    }

};


/* ==================================================
   병원 열기
   ================================================== */

function openHospital() {

    const data = languageData[currentLanguage];

    if (!data) return;


    document.getElementById(
        "hospitalImage"
    ).src = data.hospital;


    document.getElementById(
        "medicalInformation"
    ).href = data.medical;


    document.getElementById(
        "mainImage"
    ).style.display = "none";


    document.getElementById(
        "hospitalPage"
    ).style.display = "block";


    document.getElementById(
        "languageMenu"
    ).classList.remove("show");

}


/* ==================================================
   언어 메뉴 열기 / 닫기
   ================================================== */

function toggleLanguageMenu() {

    const menu =
        document.getElementById("languageMenu");

    menu.classList.toggle("show");

}


/* ==================================================
   언어 선택
   ================================================== */

function selectLanguage(lang) {

    const data = languageData[lang];

    if (!data) return;

    currentLanguage = lang;


    /* ==========================
       MAIN으로 이동
       ========================== */

    document.getElementById(
        "hospitalPage"
    ).style.display = "none";


    document.getElementById(
        "mainImage"
    ).style.display = "block";


    /* ==========================
       해당 언어 MAIN
       ========================== */

    document.getElementById(
        "mainImage"
    ).src = data.main;


    /* ==========================
       해당 언어 약국
       ========================== */

    document.getElementById(
        "pharmacyButton"
    ).href = data.pharmacy;


    /* ==========================
       메뉴 닫기
       ========================== */

    document.getElementById(
        "languageMenu"
    ).classList.remove("show");

}


/* ==================================================
   약국
   ================================================== */

function openPharmacy() {

    const data =
        languageData[currentLanguage];

    if (!data || !data.pharmacy) return;

    window.location.href =
        data.pharmacy;

}


/* ==================================================
   시작 화면
   ================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        currentLanguage = "en";


        document.getElementById(
            "mainImage"
        ).src =
            languageData.en.main;


        document.getElementById(
            "pharmacyButton"
        ).href =
            languageData.en.pharmacy;


        document.getElementById(
            "hospitalPage"
        ).style.display =
            "none";


        document.getElementById(
            "languageMenu"
        ).classList.remove("show");

    }
);

</script>

</body>
