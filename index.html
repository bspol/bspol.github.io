    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b1d3a;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 20px;
        }
        .main-img {
            width: 100%;
            height: auto;
            display: none;
        }
        .main-img.active {
            display: block;
        }
        
        /* 터치 링크 설정 */
        .touch-link {
            position: absolute;
            cursor: pointer;
            display: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            pointer-events: auto;
            box-sizing: border-box;
            background-color: transparent !important;
            border: none !important;
            z-index: 999999 !important;

        .btn-en { top: 54.0%; left: 6.5%; width: 87.0%; height: 5.2%; }

        .btn-vn { top: 72.0%; left: 6.5%; width: 87.0%; height: 5.2%; }

        .home-112 { left: 6.5%; width: 27.5%; }
        .home-119 { left: 36.2%; width: 27.5%; }
        .home-1330 { left: 66.0%; width: 27.5%; }

        .click-embassy   { top: 65.5%; left: 3.0%; width: 46.5%; height: 12.5%; }
        .click-lost      { top: 65.5%; left: 50.5%; width: 46.5%; height: 12.5%; }
        .click-rules     { top: 79.5%; left: 3.0%; width: 46.5%; height: 12.5%; }

    <script>
        var currentLang = 'en';

        function setDisplay(id, show) {
            var el = document.getElementById(id);
            if (el) el.style.display = show ? 'block' : 'none';
        }

        function goPage(pageId) {
            if (!pageId) return;

            var dropdown = document.getElementById('langDropdown');
            if (dropdown) dropdown.style.display = 'none';

            var images = document.getElementsByClassName('main-img');
            for (var i = 0; i < images.length; i++) {
                images[i].classList.remove('active');
            }

            var targetImg = document.getElementById('img-' + pageId);
            if (targetImg) targetImg.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (pageId === 'en' || pageId === 'cn' || pageId === 'jp' || pageId === 'vn') {
                currentLang = pageId;
            }

            var isHome = (pageId === 'home');
            var isMainLang = (pageId === 'en' || pageId === 'cn' || pageId === 'jp' || pageId === 'vn');
            var isPharmacySub = pageId.indexOf('pharmacy') !== -1;
            var isHospitalSub = pageId.indexOf('hospital') !== -1;
            var isMedInfoSub = pageId.indexOf('medinfo') !== -1;
            var isEmbassySub = (pageId === 'sub-embassy');
            var isRulesSub = (pageId === 'sub-rules');

            setDisplay('area-en', isHome);
            setDisplay('area-cn', isHome);
            setDisplay('area-jp', isHome);
            setDisplay('area-vn', isHome);
            setDisplay('h-112', isHome);
            setDisplay('h-119', isHome);
            setDisplay('h-1330', isHome);

            setDisplay('area-lang-dropdown', !isHome);

            setDisplay('m-112', isMainLang);
            setDisplay('m-119', isMainLang);
            setDisplay('m-1330', isMainLang);
            setDisplay('click-hosp', isMainLang);
            setDisplay('click-phar', isMainLang);
            setDisplay('click-emba', isMainLang);
            setDisplay('click-lost', isMainLang);
            setDisplay('click-rule', isMainLang);
            setDisplay('click-spots', isMainLang);

            setDisplay('p-112', isPharmacySub);
            setDisplay('p-119', isPharmacySub);
            setDisplay('p-1330', isPharmacySub);
            setDisplay('p-late', isPharmacySub);

            setDisplay('hp-112', isHospitalSub);
            setDisplay('hp-119', isHospitalSub);
            setDisplay('hp-1330', isHospitalSub);
            setDisplay('hp-find', isHospitalSub);
            setDisplay('hp-emer', isHospitalSub);
            setDisplay('hp-med', isHospitalSub);

            setDisplay('med-112', isMedInfoSub);
            setDisplay('med-119', isMedInfoSub);
            setDisplay('med-1330', isMedInfoSub);

            setDisplay('rules-112', isRulesSub);
            setDisplay('rules-119', isRulesSub);
            setDisplay('rules-1330', isRulesSub);

            setDisplay('emb-back', isEmbassySub);
            setDisplay('med-back', isMedInfoSub);

            for (var i = 1; i <= 11; i++) {
                setDisplay('emb-' + i, isEmbassySub);
            }
        }

        function toggleDropdown(event) {
            if (event) event.stopPropagation(); 
            var dropdown = document.getElementById('langDropdown');
            if (dropdown) dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
        }

        document.addEventListener('click', function(e) {
            var dropdown = document.getElementById('langDropdown');
            var dropdownBtn = document.getElementById('area-lang-dropdown');
            if (dropdown && e.target !== dropdownBtn && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        function clickSubMenu(type) {
            if (type === 'hospital') {
                goPage('sub-hospital-' + currentLang);
            } else if (type === 'pharmacy') {
                goPage('sub-pharmacy-' + currentLang);
            }
        }

        window.onload = function() {
            goPage('home');
        };
    </script>

</body>
</html>
