<script>

/* =========================================================
   현재 언어
   ========================================================= */

var currentLang = "en";


/* =========================================================
   표시 / 숨김
   ========================================================= */

function setDisplay(id, show) {

    var el = document.getElementById(id);

    if (el) {

        el.style.display =
            show ? "block" : "none";

        el.style.pointerEvents =
            show ? "auto" : "none";
    }
}


/* =========================================================
   페이지 이동
   ========================================================= */

function goPage(pageId) {

    if (!pageId) {
        return;
    }


    /* -----------------------------------------------------
       언어 메뉴 닫기
       ----------------------------------------------------- */

    var dropdown =
        document.getElementById("langDropdown");

    if (dropdown) {
        dropdown.style.display = "none";
    }


    /* -----------------------------------------------------
       모든 이미지 숨기기
       ----------------------------------------------------- */

    var images =
        document.getElementsByClassName("main-img");

    for (var i = 0; i < images.length; i++) {

        images[i].classList.remove("active");
    }


    /* -----------------------------------------------------
       선택 이미지 표시
       ----------------------------------------------------- */

    var target =
        document.getElementById("img-" + pageId);

    if (target) {

        target.classList.add("active");

    } else {

        console.log(
            "페이지를 찾을 수 없습니다:",
            pageId
        );

        return;
    }


    /* -----------------------------------------------------
       언어 저장
       ----------------------------------------------------- */

    if (
        pageId === "en" ||
        pageId === "cn" ||
        pageId === "jp" ||
        pageId === "vn" ||
        pageId === "ru" ||
        pageId === "mn" ||
        pageId === "ph"
    ) {

        currentLang = pageId;
    }


    /* -----------------------------------------------------
       페이지 종류
       ----------------------------------------------------- */

    var isHome =
        pageId === "home";


    var isMainLang =
        pageId === "en" ||
        pageId === "cn" ||
        pageId === "jp" ||
        pageId === "vn" ||
        pageId === "ru" ||
        pageId === "mn" ||
        pageId === "ph";


    var isPharmacySub =
        pageId.indexOf("pharmacy") !== -1;


    var isHospitalSub =
        pageId.indexOf("hospital") !== -1;


    var isMedInfoSub =
        pageId.indexOf("medinfo") !== -1;


    var isEmbassySub =
        pageId === "sub-embassy";


    var isRulesSub =
        pageId.indexOf("sub-law-") === 0;


    /* =====================================================
       HOME
       ===================================================== */

    setDisplay("area-en", isHome);
    setDisplay("area-jp", isHome);
    setDisplay("area-cn", isHome);
    setDisplay("area-vn", isHome);
    setDisplay("area-mn", isHome);
    setDisplay("area-ph", isHome);
    setDisplay("area-ru", isHome);

    setDisplay("h-112", isHome);
    setDisplay("h-119", isHome);
    setDisplay("h-1330", isHome);


    /* =====================================================
       지구본
       ★ HOME에서는 숨김
       ★ MAIN / 병원 / 약국에서만 표시
       ===================================================== */

    var showLanguageSelector =
        isHospitalSub ||
        isPharmacySub;

    setDisplay(
        "area-lang-dropdown",
        showLanguageSelector
    );


    /* =====================================================
       MAIN
       ===================================================== */

    setDisplay("main-home", isMainLang);

    setDisplay("m-112", isMainLang);
    setDisplay("m-119", isMainLang);
    setDisplay("m-1330", isMainLang);

    setDisplay("click-hosp", isMainLang);
    setDisplay("click-phar", isMainLang);
    setDisplay("click-emba", isMainLang);
    setDisplay("click-lost", isMainLang);
    setDisplay("click-rule", isMainLang);
    setDisplay("click-spots", isMainLang);


    /* =====================================================
       PHARMACY
       ===================================================== */

    setDisplay("p-112", isPharmacySub);
    setDisplay("p-119", isPharmacySub);
    setDisplay("p-1330", isPharmacySub);
    setDisplay("p-late", isPharmacySub);


    /* =====================================================
       HOSPITAL
       ===================================================== */

    setDisplay("hp-112", isHospitalSub);
    setDisplay("hp-119", isHospitalSub);
    setDisplay("hp-1330", isHospitalSub);
    setDisplay("hp-find", isHospitalSub);
    setDisplay("hp-emer", isHospitalSub);
    setDisplay("hp-med", isHospitalSub);


    /* =====================================================
       MEDICAL
       ===================================================== */

    setDisplay("med-112", isMedInfoSub);
    setDisplay("med-119", isMedInfoSub);
    setDisplay("med-1330", isMedInfoSub);


    /* =====================================================
       RULES
       ===================================================== */

    setDisplay("rules-112", isRulesSub);
    setDisplay("rules-119", isRulesSub);
    setDisplay("rules-1330", isRulesSub);
    setDisplay("law-back", isRulesSub);


    /* =====================================================
       EMBASSY
       ===================================================== */

    setDisplay("emb-112", isEmbassySub);
    setDisplay("emb-119", isEmbassySub);
    setDisplay("emb-1330", isEmbassySub);

    setDisplay("emb-back", isEmbassySub);
    setDisplay("med-back", isMedInfoSub);


    /* =====================================================
       영사관 국가 버튼
       ===================================================== */

    for (var i = 1; i <= 11; i++) {

        setDisplay(
            "e" + i + "-call",
            isEmbassySub
        );

        if (i !== 5) {

            setDisplay(
                "e" + i + "-home",
                isEmbassySub
            );

        } else {

            setDisplay(
                "e5-home",
                false
            );
        }
    }


    /* -----------------------------------------------------
       페이지 맨 위
       ----------------------------------------------------- */

    window.scrollTo(
        0,
        0
    );
}


/* =========================================================
   언어 선택
   ========================================================= */

function selectLanguage(lang) {

    if (!lang) {
        return;
    }

    var dropdown =
        document.getElementById("langDropdown");

    if (dropdown) {
        dropdown.style.display = "none";
    }

    goPage(lang);
}


/* =========================================================
   지구본 메뉴
   ========================================================= */

function toggleDropdown(event) {

    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }

    var dropdown =
        document.getElementById(
            "langDropdown"
        );

    if (!dropdown) {
        return;
    }

    if (
        dropdown.style.display === "block"
    ) {

        dropdown.style.display =
            "none";

    } else {

        dropdown.style.display =
            "block";
    }
}


/* =========================================================
   메뉴 바깥 클릭
   ========================================================= */

document.addEventListener(
    "click",
    function(e) {

        var dropdown =
            document.getElementById(
                "langDropdown"
            );

        var button =
            document.getElementById(
                "area-lang-dropdown"
            );

        if (
            dropdown &&
            e.target !== button &&
            !dropdown.contains(e.target)
        ) {

            dropdown.style.display =
                "none";
        }

    }
);


/* =========================================================
   병원 / 약국
   ========================================================= */

function clickSubMenu(type) {

    if (type === "hospital") {

        goPage(
            "sub-hospital-" +
            currentLang
        );

    } else if (type === "pharmacy") {

        goPage(
            "sub-pharmacy-" +
            currentLang
        );
    }
}


/* =========================================================
   초기 화면
   ========================================================= */

window.addEventListener(
    "load",
    function() {

        /*
         * 반드시 HOME부터 시작
         */

        goPage("home");

    }
);

</script>
