<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>BUSAN SAFETY GUIDE</title>

<style>

/* ==================================================
   기본
   ================================================== */

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #fff;

    overflow-x: hidden;
}

* {
    box-sizing: border-box;
}


/* ==================================================
   첫 메인 화면
   ★ home.png 그대로 사용
   ================================================== */

.home-container {
    position: relative;

    width: 100%;
    margin: 0;
    padding: 0;

    line-height: 0;
}

.home-image {
    display: block;

    width: 100%;
    height: auto;

    margin: 0;
    padding: 0;

    border: 0;

    user-select: none;
    -webkit-user-drag: none;
}


/* ==================================================
   왼쪽 상단 지구본 + English 터치 영역
   ================================================== */

#languageTrigger {

    position: absolute;

    left: 2%;
    top: 1%;

    width: 24%;
    height: 6%;

    padding: 0;
    margin: 0;

    background: transparent;

    border: 0;
    outline: none;

    z-index: 1000;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


/* ==================================================
   언어창 바깥 닫기 영역
   ================================================== */

#languageClose {

    position: fixed;

    inset: 0;

    display: none;

    background: transparent;

    z-index: 9998;
}


/* ==================================================
   ★ 작은 세로형 언어창
   ================================================== */

#languageMenu {

    position: fixed;

    top: 58px;
    left: 10px;

    width: 155px;

    display: none;

    padding: 10px;

    background: rgba(255,255,255,0.98);

    border-radius: 12px;

    box-shadow:
        0 5px 18px rgba(0,0,0,0.30);

    z-index: 9999;

    line-height: normal;
}


/* ==================================================
   언어 제목
   ================================================== */

.language-title {

    margin: 0 0 8px 0;

    padding: 0;

    text-align: center;

    font-size: 15px;
    line-height: 22px;

    font-weight: bold;

    color: #111;
}


/* ==================================================
   언어 버튼
   ================================================== */

.language-button {

    display: block;

    width: 100%;
    height: 38px;

    margin: 0 0 6px 0;
    padding: 0;

    border: 0;
    border-radius: 8px;

    background: #f0f0f0;

    color: #111;

    font-size: 15px;
    font-weight: bold;

    line-height: 38px;

    text-align: center;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}

.language-button:last-child {
    margin-bottom: 0;
}

.language-button:active {
    transform: scale(0.97);
}

</style>
</head>


<body>


<!-- ==================================================
     ★ 첫 메인 화면
     ================================================== -->

<div class="home-container">

    <img
        src="home.png"
        class="home-image"
        alt="BUSAN SAFETY GUIDE"
    >


    <!--
        왼쪽 위
        🌐 English
        터치 영역
    -->

    <button
        id="languageTrigger"
        type="button"
        aria-label="Select language">
    </button>

</div>



<!-- ==================================================
     언어창 바깥 영역
     ================================================== -->

<div id="languageClose"></div>



<!-- ==================================================
     작은 언어 선택창
     ================================================== -->

<div id="languageMenu">

    <div class="language-title">
        Select Language
    </div>


    <button
        type="button"
        class="language-button"
        data-url="index.html">
        한국어
    </button>


    <button
        type="button"
        class="language-button"
        data-url="en/">
        English
    </button>


    <button
        type="button"
        class="language-button"
        data-url="cn/">
        中文
    </button>


    <button
        type="button"
        class="language-button"
        data-url="jp/">
        日本語
    </button>


    <button
        type="button"
        class="language-button"
        data-url="vn/">
        Tiếng Việt
    </button>


    <button
        type="button"
        class="language-button"
        data-url="mn/">
        Монгол
    </button>


    <button
        type="button"
        class="language-button"
        data-url="ph/">
        Filipino
    </button>


    <button
        type="button"
        class="language-button"
        data-url="ru/">
        Русский
    </button>

</div>



<script>

/* ==================================================
   언어 메뉴
   ================================================== */

const trigger =
    document.getElementById("languageTrigger");

const menu =
    document.getElementById("languageMenu");

const closeArea =
    document.getElementById("languageClose");


/* ==================================================
   열기
   ================================================== */

trigger.addEventListener("click", function(e) {

    e.preventDefault();
    e.stopPropagation();

    if (menu.style.display === "block") {

        menu.style.display = "none";
        closeArea.style.display = "none";

    } else {

        menu.style.display = "block";
        closeArea.style.display = "block";

    }

});


/* ==================================================
   바깥쪽 터치 → 닫기
   ================================================== */

closeArea.addEventListener("click", function() {

    menu.style.display = "none";
    closeArea.style.display = "none";

});


/* ==================================================
   언어 선택
   ================================================== */

document
.querySelectorAll(".language-button")
.forEach(function(button) {

    button.addEventListener("click", function(e) {

        e.preventDefault();
        e.stopPropagation();

        const url =
            this.getAttribute("data-url");

        if (url) {
            window.location.href = url;
        }

    });

});


/* ==================================================
   ESC → 닫기
   ================================================== */

document.addEventListener("keydown", function(e) {

    if (e.key === "Escape") {

        menu.style.display = "none";
        closeArea.style.display = "none";

    }

});

</script>


</body>
</html>
