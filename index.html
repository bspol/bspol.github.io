<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Busan Foreigner Safety Platform</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b1d3a;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            padding-bottom: 20px;
        }
        .main-img {
            width: 100%;
            height: auto;
            display: none;
        }
        .main-img.active {
            display: block;
        }
        
        /* 터치 레이어 공통 (투명 처리) */
        .touch-link {
            position: absolute;
            cursor: pointer;
            display: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            pointer-events: auto;
            box-sizing: border-box;
            background-color: transparent;
            border: none;
        }

        /* =========================================
           [1. 홈 화면 (home.png) - 완벽 고정]
        ========================================= */
        .btn-en { top: 53.8%; left: 7.0%; width: 86.0%; height: 5.5%; z-index: 2000; }
        .btn-cn { top: 60.8%; left: 7.0%; width: 86.0%; height: 5.5%; z-index: 2000; }
        .btn-jp { top: 67.8%; left: 7.0%; width: 86.0%; height: 5.5%; z-index: 2000; }
        .btn-vn { top: 74.8%; left: 7.0%; width: 86.0%; height: 5.5%; z-index: 2000; }

        .home-phone { top: 84.5%; height: 8.5%; z-index: 2000; }
        .home-112 { left: 7.0%; width: 27.5%; }
        .home-119 { left: 36.2%; width: 27.5%; }
        .home-1330 { left: 65.5%; width: 27.5%; }

        /* =========================================
           [2. 상단 지구본 언어 선택 드롭다운 버튼] 
        ========================================= */
        .btn-lang-dropdown { top: 1.0%; left: 2.0%; width: 27.0%; height: 4.5%; z-index: 90000; } 

        /* =========================================
           [3. 언어 메인 화면 - CALL 버튼 3개 - 완벽 고정] 
        ========================================= */
        .main-call-112  { top: 35.8%; left: 6.0%; width: 26.0%; height: 4.8%; z-index: 999999 !important; }
        .main-call-119  { top: 35.8%; left: 37.0%; width: 26.0%; height: 4.8%; z-index: 999999 !important; }
        .main-call-1330 { top: 35.8%; left: 68.0%; width: 26.0%; height: 4.8%; z-index: 999999 !important; }

        /* =========================================
           [4. 언어 메인 화면 - 6대 카드 메뉴 - 완벽 고정] 
        ========================================= */
        .click-hospital  { top: 41.8%; left: 2.5%; width: 46.5%; height: 18.0%; z-index: 100; }
        .click-pharmacy  { top: 41.8%; left: 51.0%; width: 46.5%; height: 18.0%; z-index: 100; }
        
        .click-embassy   { top: 60.8%; left: 2.5%; width: 46.5%; height: 18.0%; z-index: 100; }
        .click-lost      { top: 60.8%; left: 51.0%; width: 46.5%; height: 18.0%; z-index: 100; }
        
        .click-rules     { top: 79.8%; left: 2.5%; width: 46.5%; height: 18.0%; z-index: 100; }
        .click-spots     { top: 79.8%; left: 51.0%; width: 46.5%; height: 18.0%; z-index: 100; }

        /* =========================================
           [5. 약국 페이지 버튼] 
        ========================================= */
        .pharm-call-112  { top: 38.0%; left: 3.5%; width: 22.0%; height: 12.0%; z-index: 999999 !important; }
        .pharm-call-119  { top: 38.0%; left: 27.5%; width: 22.0%; height: 12.0%; z-index: 999999 !important; }
        .pharm-call-1330 { top: 38.0%; left: 50.5%; width: 22.0%; height: 12.0%; z-index: 999999 !important; }
        .pharm-late-link { top: 38.0%; left: 74.0%; width: 22.5%; height: 12.0%; z-index: 999999 !important; }

        /* =========================================
           [6. 병원 페이지 전용 버튼 (119 영역 오작동 완전 차단 격리)] 
        ========================================= */
        .hosp-call-112   { top: 37.0%; left: 6.5%; width: 27.0%; height: 9.5%; z-index: 999999 !important; }
        .hosp-call-119   { top: 37.0%; left: 36.5%; width: 27.0%; height: 9.5%; z-index: 999999 !important; }
        .hosp-call-1330  { top: 37.0%; left: 66.5%; width: 27.0%; height: 9.5%; z-index: 999999 !important; }

        .hosp-find-map   { top: 54.0%; left: 5.5%; width: 29.0%; height: 24.5%; z-index: 100; }
        .hosp-emergency  { top: 54.0%; left: 35.5%; width: 29.0%; height: 24.5%; z-index: 100; }
        .hosp-medinfo    { top: 54.0%; left: 65.5%; width: 29.0%; height: 24.5%; z-index: 100; }

        /* 지구본 드롭다운 메뉴 스타일 */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 5.5%; 
            left: 2.0%;
            width: 150px;
            background-color: #12284c;
            border: 1px solid #234375;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            z-index: 9999999;
            padding: 5px 0;
        }
        .dropdown-menu a {
            display: block;
            color: #ffffff;
            padding: 12px 15px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #1c3966;
        }
        .dropdown-menu a:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ▣ 이미지 보관함 -->
        <img id="img-home" class="main-img active" src="home.png" alt="Home">
        <img id="img-en" class="main-img" src="main_en.png" alt="English">
        <img id="img-cn" class="main-img" src="main_cn.png" alt="Chinese">
        <img id="img-jp" class="main-img" src="main_jp.png" alt="Japanese">
        <img id="img-vn" class="main-img" src="main_vn.png" alt="Vietnamese">

        <img id="img-sub-rules" class="main-img" src="basicrules.png" alt="Basic Rules">
        <img id="img-sub-embassy" class="main-img" src="embassy.png" alt="Embassies">

        <!-- 병원 서브 화면들 -->
        <img id="img-sub-hospital-en" class="main-img" src="hospital_en.png" alt="Hospital EN">
        <img id="img-sub-hospital-cn" class="main-img" src="hospital_cn.png" alt="Hospital CN">
        <img id="img-sub-hospital-jp" class="main-img" src="hospital_jp.png" alt="Hospital JP">
        <img id="img-sub-hospital-vn" class="main-img" src="hospital_vn.png" alt="Hospital VN">

        <!-- 의료정보 세부 화면들 -->
        <img id="img-sub-medinfo-en" class="main-img" src="medical-info-en.png" alt="Medical Info EN">
        <img id="img-sub-medinfo-cn" class="main-img" src="medical-info-cn.png" alt="Medical Info CN">
        <img id="img-sub-medinfo-jp" class="main-img" src="medical-info-jp.png" alt="Medical Info JP">
        <img id="img-sub-medinfo-vn" class="main-img" src="medical-info-vn.png" alt="Medical Info VN">

        <!-- 약국 서브 화면들 -->
        <img id="img-sub-pharmacy-en" class="main-img" src="pharmacy_en.png" alt="Pharmacy EN">
        <img id="img-sub-pharmacy-cn" class="main-img" src="pharmacy_cn.png" alt="Pharmacy CN">
        <img id="img-sub-pharmacy-jp" class="main-img" src="pharmacy_jp.png" alt="Pharmacy JP">
        <img id="img-sub-pharmacy-vn" class="main-img" src="pharmacy_vn.png" alt="Pharmacy VN">


        <!-- ▣ 터치 레이어 (버튼 구역) -->
        
        <!-- [1. 홈 화면] -->
        <a id="area-en" href="javascript:void(0)" class="touch-link btn-en" onclick="goPage('en')"></a>
        <a id="area-cn" href="javascript:void(0)" class="touch-link btn-cn" onclick="goPage('cn')"></a>
        <a id="area-jp" href="javascript:void(0)" class="touch-link btn-jp" onclick="goPage('jp')"></a>
        <a id="area-vn" href="javascript:void(0)" class="touch-link btn-vn" onclick="goPage('vn')"></a>

        <a id="h-112" href="tel:112" class="touch-link home-phone home-112"></a>
        <a id="h-119" href="tel:119" class="touch-link home-phone home-119"></a>
        <a id="h-1330" href="tel:1330" class="touch-link home-phone home-1330"></a>

        <!-- [2. 상단 지구본 드롭다운] -->
        <a id="area-lang-dropdown" href="javascript:void(0)" class="touch-link btn-lang-dropdown" onclick="toggleDropdown(event)"></a>

        <div id="langDropdown" class="dropdown-menu">
            <a href="javascript:void(0)" onclick="goPage('home')">🏠 메인 (Home)</a>
            <a href="javascript:void(0)" onclick="goPage('en')">🇺🇸 English</a>
            <a href="javascript:void(0)" onclick="goPage('cn')">🇨🇳 中文 (简体)</a>
            <a href="javascript:void(0)" onclick="goPage('jp')">🇯🇵 日本語</a>
            <a href="javascript:void(0)" onclick="goPage('vn')">🇻🇳 Tiếng Việt</a>
        </div>

        <!-- [3. 언어 메인 전용 CALL 버튼] -->
        <a id="m-112" href="tel:112" class="touch-link main-call-112"></a>
        <a id="m-119" href="tel:119" class="touch-link main-call-119"></a>
        <a id="m-1330" href="tel:1330" class="touch-link main-call-1330"></a>

        <!-- [4. 언어 메인 전용 6대 메뉴] -->
        <a id="click-hosp" href="javascript:void(0)" class="touch-link click-hospital" onclick="clickSubMenu('hospital')"></a>
        <a id="click-phar" href="javascript:void(0)" class="touch-link click-pharmacy" onclick="clickSubMenu('pharmacy')"></a>
        <a id="click-emba" href="javascript:void(0)" class="touch-link click-embassy" onclick="goPage('sub-embassy')"></a>
        <a id="click-lost" href="https://minwon24.police.go.kr/cvlcpt/cvlcptAply.do?cvlcptId=MW-201&keyword=" target="_blank" class="touch-link click-lost"></a>
        <a id="click-rule" href="javascript:void(0)" class="touch-link click-rules" onclick="goPage('sub-rules')"></a>
        <a id="click-spot" href="https://www.google.com/maps/search/Busan+tourist+map" target="_blank" class="touch-link click-spots"></a>

        <!-- [5. 약국 페이지 전용 버튼] -->
        <a id="p-112" href="tel:112" class="touch-link pharm-call-112"></a>
        <a id="p-119" href="tel:119" class="touch-link pharm-call-119"></a>
        <a id="p-1330" href="tel:1330" class="touch-link pharm-call-1330"></a>
        <a id="p-late" href="https://www.busan.go.kr/eng/bsmedical06" target="_blank" class="touch-link pharm-late-link"></a>

        <!-- [6. 병원 페이지 전용 버튼] -->
        <a id="hp-112" href="tel:112" class="touch-link hosp-call-112"></a>
        <a id="hp-119" href="tel:119" class="touch-link hosp-call-119"></a>
        <a id="hp-1330" href="tel:1330" class="touch-link hosp-call-1330"></a>
        <a id="hp-find" href="https://www.google.com/maps/search/?api=1&query=hospital" target="_blank" class="touch-link hosp-find-map"></a>
        <a id="hp-emer" href="https://www.google.com/maps/search/?api=1&query=emergency+room" target="_blank" class="touch-link hosp-emergency"></a>
        <a id="hp-med" href="javascript:void(0)" class="touch-link hosp-medinfo" onclick="goPage('sub-medinfo-' + currentLang)"></a>
    </div>

    <script>
        var currentLang = 'en';

        function setDisplay(id, show) {
            var el = document.getElementById(id);
            if (el) {
                el.style.display = show ? 'block' : 'none';
            }
        }

        function goPage(pageId) {
            if (!pageId) return;

            var dropdown = document.getElementById('langDropdown');
            if (dropdown) dropdown.style.display = 'none';

            var images = document.getElementsByClassName('main-img');
            for (var i = 0; i < images.length; i++) {
                images[i].classList.remove('active');
            }

            var targetImg = document.getElementById('img-' + pageId);
            if (targetImg) {
                targetImg.classList.add('active');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (pageId === 'en' || pageId === 'cn' || pageId === 'jp' || pageId === 'vn') {
                currentLang = pageId;
            }

            var isHome = (pageId === 'home');
            var isMainLang = (pageId === 'en' || pageId === 'cn' || pageId === 'jp' || pageId === 'vn');
            var isPharmacySub = pageId.indexOf('pharmacy') !== -1;
            var isHospitalSub = pageId.indexOf('hospital') !== -1;

            setDisplay('area-en', isHome);
            setDisplay('area-cn', isHome);
            setDisplay('area-jp', isHome);
            setDisplay('area-vn', isHome);
            setDisplay('h-112', isHome);
            setDisplay('h-119', isHome);
            setDisplay('h-1330', isHome);

            setDisplay('area-lang-dropdown', !isHome);

            setDisplay('m-112', isMainLang);
            setDisplay('m-119', isMainLang);
            setDisplay('m-1330', isMainLang);
            setDisplay('click-hosp', isMainLang);
            setDisplay('click-phar', isMainLang);
            setDisplay('click-emba', isMainLang);
            setDisplay('click-lost', isMainLang);
            setDisplay('click-rule', isMainLang);
            setDisplay('click-spot', isMainLang);

            setDisplay('p-112', isPharmacySub);
            setDisplay('p-119', isPharmacySub);
            setDisplay('p-1330', isPharmacySub);
            setDisplay('p-late', isPharmacySub);

            setDisplay('hp-112', isHospitalSub);
            setDisplay('hp-119', isHospitalSub);
            setDisplay('hp-1330', isHospitalSub);
            setDisplay('hp-find', isHospitalSub);
            setDisplay('hp-emer', isHospitalSub);
            setDisplay('hp-med', isHospitalSub);
        }

        function toggleDropdown(event) {
            if (event) event.stopPropagation(); 
            var dropdown = document.getElementById('langDropdown');
            if (dropdown) {
                dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
            }
        }

        document.addEventListener('click', function(e) {
            var dropdown = document.getElementById('langDropdown');
            var dropdownBtn = document.getElementById('area-lang-dropdown');
            if (dropdown && e.target !== dropdownBtn && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        function clickSubMenu(type) {
            if (type === 'hospital') {
                goPage('sub-hospital-' + currentLang);
            } else if (type === 'pharmacy') {
                goPage('sub-pharmacy-' + currentLang);
            }
        }

        window.onload = function() {
            goPage('home');
        };
    </script>

</body>
</html>
