<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Busan Foreigner Safety Platform</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b1d3a;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }
        .main-img {
            width: 100%;
            height: auto;
            display: none;
        }
        .main-img.active {
            display: block;
        }
        
        /* 🚨 터치 레이어 공통 스타일 (모바일 터치 완벽 지원) */
        .touch-link {
            position: absolute;
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.001); /* 모바일 브라우저 터치 강제 인식용 */
            display: none; /* 기본은 안 보이게 숨김 (터치 차단) */
            z-index: 100;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* 💡 테스트할 때 위치를 빨간 상자로 확인하고 싶다면 아래 주석(//)을 제거하세요 */
        /* .touch-link { background-color: rgba(255, 0, 0, 0.3) !important; } */

        /* [1. 홈 화면 버튼] */
        .btn-en { top: 55.6%; left: 6.7%; width: 86.6%; height: 6.2%; }
        .btn-cn { top: 62.4%; left: 6.7%; width: 86.6%; height: 6.2%; }
        .btn-jp { top: 69.2%; left: 6.7%; width: 86.6%; height: 6.2%; }
        .btn-vn { top: 76.0%; left: 6.7%; width: 86.6%; height: 6.2%; }

        .home-phone { top: 81.5%; height: 10.5%; }
        .home-112 { left: 6.7%; width: 27.5%; }
        .home-119 { left: 36.2%; width: 27.5%; }
        .home-1330 { left: 65.8%; width: 27.5%; }

        /* [2. 상단 내비게이션 / 긴급전화] */
        .btn-lang-dropdown { top: 0.5%; left: 2.0%; width: 25.0%; height: 5.0%; z-index: 500; } 

        .call-112 { top: 6.0%; left: 2.5%; width: 30.0%; height: 6.0%; z-index: 300; }
        .call-119 { top: 6.0%; left: 35.0%; width: 30.0%; height: 6.0%; z-index: 300; }
        .call-1330 { top: 6.0%; left: 67.5%; width: 30.0%; height: 6.0%; z-index: 300; }

        /* [3. 메인 언어별 화면 하부 6개 메뉴] */
        .click-hospital  { top: 45.4%; left: 2.5%; width: 46.5%; height: 14.0%; }
        .click-pharmacy  { top: 45.4%; left: 51.0%; width: 46.5%; height: 14.0%; }
        .click-embassy   { top: 62.0%; left: 2.5%; width: 46.5%; height: 14.0%; }
        .click-lost      { top: 62.0%; left: 51.0%; width: 46.5%; height: 14.0%; }
        .click-rules     { top: 78.0%; left: 2.5%; width: 46.5%; height: 14.0%; }
        .click-spots     { top: 78.0%; left: 51.0%; width: 46.5%; height: 14.0%; }

        /* [4. 병원 및 메디컬 화면 외부 링크 영역] */
        .hospital-ext-link { top: 82.0%; left: 5.0%; width: 90.0%; height: 12.0%; z-index: 200; }

        /* 언어 선택 드롭다운 메뉴 스타일 */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 5.5%; 
            left: 2.0%;
            width: 150px;
            background-color: #12284c;
            border: 1px solid #234375;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            z-index: 9999;
            padding: 5px 0;
        }
        .dropdown-menu a {
            display: block;
            color: #ffffff;
            padding: 12px 15px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #1c3966;
        }
        .dropdown-menu a:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ▣ 이미지 파일 보관함 -->
        <img id="img-home" class="main-img active" src="home.png" alt="Home">
        <img id="img-en" class="main-img" src="main_en.png" alt="English">
        <img id="img-cn" class="main-img" src="main_cn.png" alt="Chinese">
        <img id="img-jp" class="main-img" src="main_jp.png" alt="Japanese">
        <img id="img-vn" class="main-img" src="main_vn.png" alt="Vietnamese">

        <!-- 서브 화면들 -->
        <img id="img-sub-rules" class="main-img" src="basicrules.png" alt="Basic Rules">
        <img id="img-sub-embassy" class="main-img" src="embassy.png" alt="Embassies">
        <img id="img-sub-medinfo" class="main-img" src="medical_info.png" alt="Medical Info">

        <!-- 병원 서브 화면들 -->
        <img id="img-sub-hospital-en" class="main-img" src="hospital_en.png" alt="Hospital EN">
        <img id="img-sub-hospital-cn" class="main-img" src="hospital_cn.png" alt="Hospital CN">
        <img id="img-sub-hospital-jp" class="main-img" src="hospital_jp.png" alt="Hospital JP">
        <img id="img-sub-hospital-vn" class="main-img" src="hospital_vn.png" alt="Hospital VN">

        <!-- 약국 서브 화면들 -->
        <img id="img-sub-pharmacy-en" class="main-img" src="pharmacy_en.png" alt="Pharmacy EN">
        <img id="img-sub-pharmacy-cn" class="main-img" src="pharmacy_cn.png" alt="Pharmacy CN">
        <img id="img-sub-pharmacy-jp" class="main-img" src="pharmacy_jp.png" alt="Pharmacy JP">
        <img id="img-sub-pharmacy-vn" class="main-img" src="pharmacy_vn.png" alt="Pharmacy VN">


        <!-- ▣ 터치 레이어 배포 구역 -->
        
        <!-- [홈 화면 전용 버튼] -->
        <div id="area-en" class="touch-link btn-en" onclick="showPage('en')"></div>
        <div id="area-cn" class="touch-link btn-cn" onclick="showPage('cn')"></div>
        <div id="area-jp" class="touch-link btn-jp" onclick="showPage('jp')"></div>
        <div id="area-vn" class="touch-link btn-vn" onclick="showPage('vn')"></div>

        <a id="h-112" href="tel:112" class="touch-link home-phone home-112"></a>
        <a id="h-119" href="tel:119" class="touch-link home-phone home-119"></a>
        <a id="h-1330" href="tel:1330" class="touch-link home-phone home-1330"></a>

        <!-- [상단 메뉴 드롭다운 및 전화 버튼] -->
        <div id="area-lang-dropdown" class="touch-link btn-lang-dropdown" onclick="toggleDropdown(event)"></div>

        <div id="langDropdown" class="dropdown-menu">
            <a href="javascript:void(0)" onclick="changeLanguageDirect('home')">🏠 메인 (Home)</a>
            <a href="javascript:void(0)" onclick="changeLanguageDirect('en')">🇺🇸 English</a>
            <a href="javascript:void(0)" onclick="changeLanguageDirect('cn')">🇨🇳 中文 (简体)</a>
            <a href="javascript:void(0)" onclick="changeLanguageDirect('jp')">🇯🇵 日本語</a>
            <a href="javascript:void(0)" onclick="changeLanguageDirect('vn')">🇻🇳 Tiếng Việt</a>
        </div>

        <a id="c-112" href="tel:112" class="touch-link call-112"></a>
        <a id="c-119" href="tel:119" class="touch-link call-119"></a>
        <a id="c-1330" href="tel:1330" class="touch-link call-1330"></a>

        <!-- [메인 가이드 화면 하부 6대 메뉴] -->
        <div id="click-hosp" class="touch-link click-hospital" onclick="clickSubMenu('hospital')"></div>
        <div id="click-phar" class="touch-link click-pharmacy" onclick="clickSubMenu('pharmacy')"></div>
        <div id="click-emba" class="touch-link click-embassy" onclick="showPage('sub-embassy')"></div>
        <a id="click-lost" href="https://minwon24.police.go.kr/cvlcpt/cvlcptAply.do?cvlcptId=MW-201&keyword=" target="_blank" class="touch-link click-lost"></a>
        <div id="click-rule" class="touch-link click-rules" onclick="showPage('sub-rules')"></div>
        <a id="click-spot" href="https://www.visitbusan.net/index.do" target="_blank" class="touch-link click-spots"></a>

        <!-- [병원 상세 페이지 하단 외부 링크] -->
        <a id="go-ext-hospital" href="https://www.busan.go.kr/eng/bsmedical01" target="_blank" class="touch-link hospital-ext-link"></a>
    </div>

    <script>
        var currentLang = 'en'; // 기본 언어 설정

        // 페이지 로드 시 첫 화면 세팅
        window.onload = function() {
            showPage('home');
        };

        function setDisplay(id, show) {
            var el = document.getElementById(id);
            if (el) {
                el.style.display = show ? 'block' : 'none';
            }
        }

        function showPage(pageId) {
            document.getElementById('langDropdown').style.display = 'none';

            // 모든 화면 숨기기
            var images = document.getElementsByClassName('main-img');
            for (var i = 0; i < images.length; i++) {
                images[i].classList.remove('active');
            }

            // Target 화면 표시
            var targetImg = document.getElementById('img-' + pageId);
            if (targetImg) {
                targetImg.classList.add('active');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // 언어 기억
            if (pageId === 'en' || pageId === 'cn' || pageId === 'jp' || pageId === 'vn') {
                currentLang = pageId;
            }

            var isHome = (pageId === 'home');
            var isMainLang = (pageId === 'en' || pageId === 'cn' || pageId === 'jp' || pageId === 'vn');
            var isHospitalSub = pageId.includes('hospital');

            // 1. 홈 화면 전용 버튼 제어
            setDisplay('area-en', isHome);
            setDisplay('area-cn', isHome);
            setDisplay('area-jp', isHome);
            setDisplay('area-vn', isHome);
            setDisplay('h-112', isHome);
            setDisplay('h-119', isHome);
            setDisplay('h-1330', isHome);

            // 2. 상단 지구본(드롭다운 버튼) 제어 (홈이 아닐 때만 노출)
            setDisplay('area-lang-dropdown', !isHome);

            // 3. 서브화면 긴급전화 버튼 제어 (홈이 아닐 때만 노출)
            setDisplay('c-112', !isHome);
            setDisplay('c-119', !isHome);
            setDisplay('c-1330', !isHome);

            // 4. 국가별 메인 화면일 때만 6개 메뉴 버튼 활성화
            setDisplay('click-hosp', isMainLang);
            setDisplay('click-phar', isMainLang);
            setDisplay('click-emba', isMainLang);
            setDisplay('click-lost', isMainLang);
            setDisplay('click-rule', isMainLang);
            setDisplay('click-spot', isMainLang);

            // 5. 병원 상세화면 하단 외부 링크 활성화
            setDisplay('go-ext-hospital', isHospitalSub);
        }

        function toggleDropdown(event) {
            if (event) event.stopPropagation(); 
            var dropdown = document.getElementById('langDropdown');
            dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
        }

        function changeLanguageDirect(langCode) {
            document.getElementById('langDropdown').style.display = 'none';
            showPage(langCode);
        }

        document.addEventListener('click', function(e) {
            var dropdown = document.getElementById('langDropdown');
            var dropdownBtn = document.getElementById('area-lang-dropdown');
            if (dropdown && e.target !== dropdownBtn && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        function clickSubMenu(type) {
            if (type === 'hospital') {
                // 언어별 부산시 의료 정보 링크 설정
                var extLink = document.getElementById('go-ext-hospital');
                if (currentLang === 'en') extLink.href = "https://www.busan.go.kr/eng/bsmedical01";
                if (currentLang === 'cn') extLink.href = "https://www.busan.go.kr/chn/bsmedical01";
                if (currentLang === 'jp') extLink.href = "https://www.busan.go.kr/jap/bsmedical01";
                if (currentLang === 'vn') extLink.href = "https://www.busan.go.kr/eng/bsmedical01";

                showPage('sub-hospital-' + currentLang);
            } else if (type === 'pharmacy') {
                showPage('sub-pharmacy-' + currentLang);
            }
        }
    </script>

</body>
</html>
