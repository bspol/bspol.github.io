<!DOCTYPE html>

<title>SAFE IN BUSAN</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 1080px;
    max-height: 1920px;
    margin: auto;
    overflow: hidden;
}

.screen {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.screen img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}


/* ==================================================
   투명 터치 영역
   ================================================== */

.touch {
    position: absolute;
    background: transparent;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    z-index: 20;
}


/* ==================================================
   MAIN
   ================================================== */

.main-language-button {
    left: 0%;
    top: 0%;
    width: 35%;
    height: 10%;
}

.main-112 {
    left: 2%;

}

.main-119 {
    left: 34%;
    top: 32.3%;

}

.main-1330 {
    left: 66%;

}

.main-hospital {
    left: 2%;
    top: 47%;
    width: 47.8%;
    height: 16.8%;
}

.main-pharmacy {
    left: 50.2%;
    top: 47%;
    width: 47.8%;
    height: 16.8%;
}


/* ==================================================
   HOSPITAL
   ================================================== */

#hospitalPage {
    display: none;
}

.hospital-language-button {
    left: 0%;
    top: 0%;
    width: 35%;

}

.hospital-112 {
    left: 4%;

    height: 14%;
}

.hospital-119 {
    left: 36%;
    top: 45%;
    width: 28%;

}

.hospital-1330 {
    left: 68%;
    top: 45%;
    width: 28%;

}

.find-hospital {
    left: 4%;

}

    left: 36%;

}

.medical-info {
    left: 68%;
    top: 61%;

    height: 26%;
}


/* ==================================================
   LANGUAGE MENU
   ================================================== */

#languageClose {
    position: fixed;
    inset: 0;

    display: none;

    background: rgba(0,0,0,0.35);

    z-index: 900;
}

#languageMenu {
    position: absolute;

    display: none;

    left: 5%;
    top: 8%;
    width: 90%;

    background: rgba(255,255,255,0.97);

    border-radius: 20px;

    padding: 20px;

    z-index: 1000;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.4);
}

.language-title {
    text-align: center;

    font-size: 26px;
    font-weight: bold;

    margin-bottom: 15px;
}

.language-button {
    display: block;

    width: 100%;
    min-height: 60px;

    margin-bottom: 10px;

    border: none;

    border-radius: 12px;

    background: #f0f0f0;

    font-size: 21px;
    font-weight: bold;

    cursor: pointer;
}

.language-button:last-child {
    margin-bottom: 0;
}

.language-button:active {
    transform: scale(0.98);
}

</style>

</head>


<body>

<div id="app">


    <!-- ==================================================
         MAIN PAGE
         ================================================== -->

    <div id="mainPage" class="screen">

        <img
            id="mainImage"
            src="./main_en.png"
            alt="SAFE IN BUSAN"
        >


        <!-- 언어 -->
        <button
            class="touch main-language-button"
            onclick="openLanguageMenu()"
            aria-label="Select language">
        </button>


        <!-- 112 -->
        <a
            class="touch main-112"
            href="tel:112"
            aria-label="112">
        </a>


        <!-- 119 -->
        <a
            class="touch main-119"
            href="tel:119"
            aria-label="119">
        </a>


        <!-- 1330 -->
        <a
            class="touch main-1330"
            href="tel:1330"
            aria-label="1330">
        </a>


        <!-- 병원 -->
        <button
            class="touch main-hospital"
            onclick="openHospital()"
            aria-label="Hospital">
        </button>


        <!-- 약국 -->
        <button
            class="touch main-pharmacy"
            onclick="openPharmacy()"
            aria-label="Pharmacy">
        </button>

    </div>



    <!-- ==================================================
         HOSPITAL PAGE
         ================================================== -->

    <div id="hospitalPage" class="screen">

        <img
            id="hospitalImage"
            src="./hospital_en.png"
            alt="Hospital"
        >


        <!-- 언어 -->
        <button
            class="touch hospital-language-button"
            onclick="openLanguageMenu()"
            aria-label="Select language">
        </button>


        <!-- 112 -->
        <a
            class="touch hospital-112"
            href="tel:112"
            aria-label="112">
        </a>


        <!-- 119 -->
        <a
            class="touch hospital-119"
            href="tel:119"
            aria-label="119">
        </a>


        <!-- 1330 -->
        <a
            class="touch hospital-1330"
            href="tel:1330"
            aria-label="1330">
        </a>


        <!-- 병원 찾기 -->
        <button
            class="touch find-hospital"
            onclick="findHospital()"
            aria-label="Find hospital">
        </button>


        <!-- 응급실 찾기 -->
        <button
            class="touch find-emergency"
            onclick="findEmergency()"
            aria-label="Find emergency room">
        </button>


        <!-- 의료정보 -->
        <button
            class="touch medical-info"
            onclick="openMedicalInfo()"
            aria-label="Medical information">
        </button>

    </div>



    <!-- ==================================================
         LANGUAGE BACKGROUND
         ================================================== -->

    <div
        id="languageClose"
        onclick="closeLanguageMenu()">
    </div>



    <!-- ==================================================
         LANGUAGE MENU
         ================================================== -->

    <div id="languageMenu">

        <div class="language-title">
            Select Language
        </div>


        <button
            class="language-button"
            onclick="selectLanguage('en')">
            English
        </button>


        <button
            class="language-button"
            onclick="selectLanguage('jp')">
            日本語
        </button>


        <button
            class="language-button"
            onclick="selectLanguage('cn')">
            中文
        </button>


        <button
            class="language-button"
            onclick="selectLanguage('ru')">
            Русский
        </button>


        <button
            class="language-button"
            onclick="selectLanguage('vn')">
            Tiếng Việt
        </button>


        <button
            class="language-button"
            onclick="selectLanguage('mn')">
            Монгол
        </button>


        <button
            class="language-button"
            onclick="selectLanguage('ph')">
            Filipino
        </button>

    </div>

</div>



<script>

/* ==================================================
   LANGUAGE DATA
   ================================================== */

const languages = {

    en: {
        main: "./main_en.png",
        hospital: "./hospital_en.png",
        pharmacy: "./pharmacy_en.png",
        medical: "./medical-info-en.png"
    },

    jp: {
        main: "./main_jp.png",
        hospital: "./hospital_jp.png",
        pharmacy: "./pharmacy_jp.png",
        medical: "./medical-info-jp.png"
    },

    cn: {
        main: "./main_cn.png",
        hospital: "./hospital_cn.png",
        pharmacy: "./pharmacy_cn.png",
        medical: "./medical-info-cn.png"
    },

    ru: {
        main: "./main_ru.png",
        hospital: "./hospital_ru.png",
        pharmacy: "./pharmacy_ru.png",
        medical: "./medical-info-ru.png"
    },

    vn: {
        main: "./main_vn.png",
        hospital: "./hospital_vn.png",
        pharmacy: "./pharmacy_vn.png",
        medical: "./medical-info-vn.png"
    },

    mn: {
        main: "./main_mn.png",
        hospital: "./hospital_mn.png",
        pharmacy: "./pharmacy_mn.png",
        medical: "./medical-info-mn.png"
    },

    ph: {
        main: "./main_ph.png",
        hospital: "./hospital_ph.png",
        pharmacy: "./pharmacy_ph.png",
        medical: "./medical-info-ph.png"
    }

};


/* ==================================================
   CURRENT LANGUAGE
   ================================================== */

let currentLanguage = "en";


/* ==================================================
   OPEN LANGUAGE MENU
   ================================================== */

function openLanguageMenu() {

    document.getElementById("languageClose").style.display = "block";

    document.getElementById("languageMenu").style.display = "block";
}


/* ==================================================
   CLOSE LANGUAGE MENU
   ================================================== */

function closeLanguageMenu() {

    document.getElementById("languageClose").style.display = "none";

    document.getElementById("languageMenu").style.display = "none";
}


/* ==================================================
   SELECT LANGUAGE
   ================================================== */

function selectLanguage(lang) {

    console.log("Selected language:", lang);

    if (!languages[lang]) {

        console.error("Language not found:", lang);

        return;
    }


    /* 현재 언어 저장 */
    currentLanguage = lang;


    const data = languages[lang];


    /* ==================================================
       해당 나라 MAIN 화면으로 변경
       ================================================== */

    document.getElementById("mainImage").src = data.main;


    /* ==================================================
       병원 화면도 해당 나라로 변경
       ================================================== */

    document.getElementById("hospitalImage").src = data.hospital;


    /* ==================================================
       메뉴 닫기
       ================================================== */

    closeLanguageMenu();


    /* ==================================================
       병원 화면에서 언어를 눌렀더라도
       해당 나라 MAIN으로 이동
       ================================================== */

    document.getElementById("hospitalPage").style.display = "none";

    document.getElementById("mainPage").style.display = "block";


    /* ==================================================
       페이지 맨 앞으로 이동
       ================================================== */

    window.scrollTo(0, 0);
}


/* ==================================================
   OPEN HOSPITAL
   ================================================== */

function openHospital() {

    const data = languages[currentLanguage];


    /* 현재 언어의 병원 이미지 */
    document.getElementById("hospitalImage").src =
        data.hospital;


    /* MAIN 숨기기 */
    document.getElementById("mainPage").style.display =
        "none";


    /* HOSPITAL 표시 */
    document.getElementById("hospitalPage").style.display =
        "block";
}


/* ==================================================
   OPEN PHARMACY
   ================================================== */

function openPharmacy() {

    const data = languages[currentLanguage];


    /*
       현재 선택된 나라의 약국 이미지로 이동
    */

    window.location.href = data.pharmacy;
}


/* ==================================================
   FIND HOSPITAL
   ================================================== */

function findHospital() {

    window.open(
        "https://www.google.com/maps/search/?api=1&query=hospital+near+me",
        "_blank"
    );
}


/* ==================================================
   FIND EMERGENCY ROOM
   ================================================== */

function findEmergency() {

    window.open(
        "https://www.google.com/maps/search/?api=1&query=emergency+room+near+me",
        "_blank"
    );
}


/* ==================================================
   OPEN MEDICAL INFORMATION
   ================================================== */

function openMedicalInfo() {

    const data = languages[currentLanguage];


    window.location.href = data.medical;
}


/* ==================================================
   INITIALIZATION
   ================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        currentLanguage = "en";


        document.getElementById("mainPage").style.display =
            "block";


        document.getElementById("hospitalPage").style.display =
            "none";


        document.getElementById("mainImage").src =
            languages.en.main;


        document.getElementById("hospitalImage").src =
            languages.en.hospital;

    }
);

</script>

</body>
</html>
