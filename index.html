<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

  <title>SAFE IN BUSAN</title>

  <!-- 홈 화면 추가 아이콘 -->
  <link rel="apple-touch-icon" href="./icon.png" />
  <link rel="icon" type="image/png" href="./icon.png" />

  <!-- iPhone 홈 화면 실행 시 앱처럼 표시 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SAFE BUSAN" />
  <meta name="theme-color" content="#ffffff" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      font-family: Arial, sans-serif;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* 원본 1024 x 1536 비율 유지 */
    .page {
      position: relative;
      width: min(100vw, 1024px);
      aspect-ratio: 1024 / 1536;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
    }

    .home-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* 공통 투명 터치 영역 */
    .tap-area {
      position: absolute;
      display: block;
      z-index: 10;
      border-radius: 14px;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* 눌렀을 때만 아주 약하게 표시 */
    .tap-area:active {
      background: rgba(0, 70, 200, 0.07);
    }

    /*
      언어 버튼 영역
      기준 이미지: 1024 x 1536
      4열 x 4행
      각 버튼 전체(국기 + 언어명 + 화살표)를 덮도록 설정
    */

    /* 1행 */
    .ko { left: 4.1%;  top: 52.0%; width: 23.2%; height: 6.9%; }
    .en { left: 28.5%; top: 52.0%; width: 23.2%; height: 6.9%; }
    .ja { left: 52.8%; top: 52.0%; width: 23.2%; height: 6.9%; }
    .zh { left: 77.1%; top: 52.0%; width: 19.7%; height: 6.9%; }

    /* 2행 */
    .vi  { left: 4.1%;  top: 59.0%; width: 23.2%; height: 6.9%; }
    .mn  { left: 28.5%; top: 59.0%; width: 23.2%; height: 6.9%; }
    .fil { left: 52.8%; top: 59.0%; width: 23.2%; height: 6.9%; }
    .ru  { left: 77.1%; top: 59.0%; width: 19.7%; height: 6.9%; }

    /* 3행 */
    .id { left: 4.1%;  top: 66.0%; width: 23.2%; height: 6.9%; }
    .uz { left: 28.5%; top: 66.0%; width: 23.2%; height: 6.9%; }
    .th { left: 52.8%; top: 66.0%; width: 23.2%; height: 6.9%; }
    .km { left: 77.1%; top: 66.0%; width: 19.7%; height: 6.9%; }

    /* 4행 */
    .my { left: 4.1%;  top: 73.0%; width: 23.2%; height: 6.9%; }
    .tl { left: 28.5%; top: 73.0%; width: 23.2%; height: 6.9%; }
    .ne { left: 52.8%; top: 73.0%; width: 23.2%; height: 6.9%; }
    .tr { left: 77.1%; top: 73.0%; width: 19.7%; height: 6.9%; }

    /* 하단 긴급전화도 실제 전화 연결되게 설정 */
    .call-112 {
      left: 4.9%;
      top: 85.0%;
      width: 29.5%;
      height: 6.5%;
      border-radius: 16px;
    }

    .call-119 {
      left: 36.0%;
      top: 85.0%;
      width: 28.5%;
      height: 6.5%;
      border-radius: 16px;
    }

    .call-1330 {
      left: 66.2%;
      top: 85.0%;
      width: 29.2%;
      height: 6.5%;
      border-radius: 16px;
    }

    /* PC에서 너무 크게 늘어나지 않도록 */
    @media (min-width: 1025px) {
      .page {
        box-shadow: 0 0 18px rgba(0,0,0,0.08);
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- 홈 이미지 파일명 -->
    <img
      src="./home.png"
      alt="SAFE IN BUSAN 외국인 안전 안내"
      class="home-image"
    />

    <!-- =========================
         16개 언어 연결
         각 폴더 안에 index.html이 있는 구조 기준
         ========================= -->

    <!-- 1행 -->
    <a class="tap-area ko" href="./ko/" aria-label="한국어"></a>
    <a class="tap-area en" href="./en/" aria-label="English"></a>
    <a class="tap-area ja" href="./ja/" aria-label="日本語"></a>
    <a class="tap-area zh" href="./zh/" aria-label="中文"></a>

    <!-- 2행 -->
    <a class="tap-area vi" href="./vi/" aria-label="Tiếng Việt"></a>
    <a class="tap-area mn" href="./mn/" aria-label="Монгол"></a>
    <a class="tap-area fil" href="./fil/" aria-label="Filipino"></a>
    <a class="tap-area ru" href="./ru/" aria-label="Русский"></a>

    <!-- 3행 -->
    <a class="tap-area id" href="./id/" aria-label="Bahasa Indonesia"></a>
    <a class="tap-area uz" href="./uz/" aria-label="O‘zbekcha"></a>
    <a class="tap-area th" href="./th/" aria-label="ภาษาไทย"></a>
    <a class="tap-area km" href="./km/" aria-label="ភាសាខ្មែរ"></a>

    <!-- 4행 -->
    <a class="tap-area my" href="./my/" aria-label="မြန်မာဘာသာ"></a>
    <a class="tap-area tl" href="./tl/" aria-label="Tagalog"></a>
    <a class="tap-area ne" href="./ne/" aria-label="नेपाली"></a>
    <a class="tap-area tr" href="./tr/" aria-label="Türkçe"></a>

    <!-- =========================
         긴급전화 버튼
         ========================= -->
    <a class="tap-area call-112" href="tel:112" aria-label="경찰 112 전화"></a>
    <a class="tap-area call-119" href="tel:119" aria-label="소방 구급 119 전화"></a>
    <a class="tap-area call-1330" href="tel:1330" aria-label="관광안내 1330 전화"></a>

  </main>

</body>
</html>
