<head>

      content="width=device-width,

<title>SAFE IN BUSAN</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 1080px;
    max-height: 1920px;
    margin: auto;
    overflow: hidden;
}

.screen {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.screen img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}


/* ==================================================
   공통 투명 터치 영역
   ================================================== */

.touch {
    position: absolute;
    background: transparent;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    z-index: 20;
}


/* ==================================================
   MAIN 화면
   ================================================== */

/*
   PNG 안에 이미 있는
   지구본 + 나라 이름 부분

   HTML에서는 아무것도 표시하지 않음.
*/
.main-language-button {
    left: 0%;
    top: 0%;
    width: 35%;
    height: 10%;
}


/* 112 */
.main-112 {
    left: 2%;
    top: 32.3%;
    width: 31%;
    height: 13.7%;
}


/* 119 */
.main-119 {
    left: 34%;
    top: 32.3%;
    width: 31%;
    height: 13.7%;
}


/* 1330 */
.main-1330 {
    left: 66%;
    top: 32.3%;
    width: 32%;
    height: 13.7%;
}


/* 병원 */
.main-hospital {
    left: 2%;
    top: 47%;
    width: 47.8%;
    height: 16.8%;
}


/* 약국 */
.main-pharmacy {
    left: 50.2%;
    top: 47%;
    width: 47.8%;
    height: 16.8%;
}


/* ==================================================
   HOSPITAL 화면
   ================================================== */

#hospitalPage {
    display: none;
}


/*
   병원 PNG에 이미 있는
   지구본 + 나라 이름 위에
   투명 버튼만 설치
*/
.hospital-language-button {
    left: 0%;
    top: 0%;
    width: 35%;
    height: 10%;
}


/* 112 */
.hospital-112 {
    left: 4%;
    top: 45%;
    width: 28%;
    height: 14%;
}


/* 119 */
.hospital-119 {
    left: 36%;
    top: 45%;
    width: 28%;
    height: 14%;
}


/* 1330 */
.hospital-1330 {
    left: 68%;
    top: 45%;
    width: 28%;
    height: 14%;
}


/* 병원 찾기 */
.find-hospital {
    left: 4%;
    top: 61%;
    width: 28%;
    height: 26%;
}


/* 응급실 찾기 */
.find-emergency {
    left: 36%;
    top: 61%;
    width: 28%;
    height: 26%;
}


/* 의료정보 */
.medical-info {
    left: 68%;
    top: 61%;
    width: 28%;
    height: 26%;
}


/* ==================================================
   PHARMACY 화면
   ================================================== */

#pharmacyPage {
    display: none;
}


/*
   약국 PNG에 이미 있는
   지구본 + 나라 이름 위에
   투명 버튼만 설치
*/
.pharmacy-language-button {
    left: 0%;
    top: 0%;
    width: 35%;
    height: 10%;
}


/* ==================================================
   언어 선택 BACKDROP
   ================================================== */

/*
   언어 메뉴가 열리면 화면 전체를 덮는다.

   메뉴 바깥을 누르면 닫힘.
*/
#languageClose {
    position: fixed;

    left: 0;
    top: 0;
    right: 0;
    bottom: 0;

    display: none;

    background: rgba(0,0,0,0.35);

    z-index: 900;

    cursor: pointer;
}


/* ==================================================
   언어 선택 메뉴
   ================================================== */

#languageMenu {
    position: absolute;

    display: none;

    left: 5%;
    top: 8%;

    width: 90%;

    background: rgba(255,255,255,0.98);

    border-radius: 20px;

    padding: 20px;

    z-index: 1000;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.4);
}


.language-title {
    text-align: center;

    font-size: 26px;

    font-weight: bold;

    margin-bottom: 15px;
}


.language-button {
    display: block;

    width: 100%;

    min-height: 60px;

    margin-bottom: 10px;

    border: none;

    border-radius: 12px;

    background: #f0f0f0;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;
}


.language-button:last-child {
    margin-bottom: 0;
}


.language-button:active {
    transform: scale(0.98);
}

</style>

</head>


<body>

<div id="app">


    <!-- ==================================================
         MAIN PAGE
         ================================================== -->

    <div id="mainPage" class="screen">

        <img id="mainImage"
             src="./main_en.png"
             alt="SAFE IN BUSAN">


        <!--
            PNG에 이미 있는
            지구본 + 나라 이름

            HTML에는 아무 글자도 만들지 않음.
            투명 터치 영역만 존재.
        -->
        <button
            type="button"
            class="touch main-language-button"
            onclick="openLanguageMenu(event)"
            aria-label="Select language">
        </button>


        <!-- 112 -->
        <a
            class="touch main-112"
            href="tel:112"
            aria-label="112">
        </a>


        <!-- 119 -->
        <a
            class="touch main-119"
            href="tel:119"
            aria-label="119">
        </a>


        <!-- 1330 -->
        <a
            class="touch main-1330"
            href="tel:1330"
            aria-label="1330">
        </a>


        <!-- 병원 -->
        <button
            type="button"
            class="touch main-hospital"
            onclick="openHospital()"
            aria-label="Hospital">
        </button>


        <!-- 약국 -->
        <button
            type="button"
            class="touch main-pharmacy"
            onclick="openPharmacy()"
            aria-label="Pharmacy">
        </button>

    </div>



    <!-- ==================================================
         HOSPITAL PAGE
         ================================================== -->

    <div id="hospitalPage" class="screen">

        <img id="hospitalImage"
             src="./hospital_en.png"
             alt="Hospital">


        <!--
            병원 PNG에 이미 있는
            지구본 + 나라 이름
        -->
        <button
            type="button"
            class="touch hospital-language-button"
            onclick="openLanguageMenu(event)"
            aria-label="Select language">
        </button>


        <!-- 112 -->
        <a
            class="touch hospital-112"
            href="tel:112"
            aria-label="112">
        </a>


        <!-- 119 -->
        <a
            class="touch hospital-119"
            href="tel:119"
            aria-label="119">
        </a>


        <!-- 1330 -->
        <a
            class="touch hospital-1330"
            href="tel:1330"
            aria-label="1330">
        </a>


        <!-- 병원 찾기 -->
        <button
            type="button"
            class="touch find-hospital"
            onclick="findHospital()"
            aria-label="Find hospital">
        </button>


        <!-- 응급실 찾기 -->
        <button
            type="button"
            class="touch find-emergency"
            onclick="findEmergency()"
            aria-label="Find emergency room">
        </button>


        <!-- 의료정보 -->
        <button
            type="button"
            class="touch medical-info"
            onclick="openMedicalInfo()"
            aria-label="Medical information">
        </button>

    </div>



    <!-- ==================================================
         PHARMACY PAGE
         ================================================== -->

    <div id="pharmacyPage" class="screen">

        <img id="pharmacyImage"
             src="./pharmacy_en.png"
             alt="Pharmacy">


        <!--
            약국 PNG에 이미 있는
            지구본 + 나라 이름

            HTML에서는 지구본이나 나라 이름을
            새로 표시하지 않음.
        -->
        <button
            type="button"
            class="touch pharmacy-language-button"
            onclick="openLanguageMenu(event)"
            aria-label="Select language">
        </button>

    </div>



    <!-- ==================================================
         언어 선택 BACKDROP
         ================================================== -->

    <div id="languageClose"
         onclick="closeLanguageMenu(event)">
    </div>



    <!-- ==================================================
         언어 선택 메뉴
         ================================================== -->

    <div id="languageMenu"
         onclick="event.stopPropagation()">


        <div class="language-title">
            Select Language
        </div>


        <button
            type="button"
            class="language-button"
            onclick="selectLanguage('en')">
            English
        </button>


        <button
            type="button"
            class="language-button"
            onclick="selectLanguage('jp')">
            日本語
        </button>


        <button
            type="button"
            class="language-button"
            onclick="selectLanguage('cn')">
            中文
        </button>


        <button
            type="button"
            class="language-button"
            onclick="selectLanguage('ru')">
            Русский
        </button>


        <button
            type="button"
            class="language-button"
            onclick="selectLanguage('vn')">
            Tiếng Việt
        </button>


        <button
            type="button"
            class="language-button"
            onclick="selectLanguage('mn')">
            Монгол
        </button>


        <button
            type="button"
            class="language-button"
            onclick="selectLanguage('ph')">
            Filipino
        </button>

    </div>

</div>


<script>

/* ==================================================
   7개 언어 파일 설정
   ================================================== */

const languages = {

    en: {
        main: "./main_en.png",
        hospital: "./hospital_en.png",
        pharmacy: "./pharmacy_en.png",
        medical: "./medical-info-en.png"
    },

    jp: {
        main: "./main_jp.png",
        hospital: "./hospital_jp.png",
        pharmacy: "./pharmacy_jp.png",
        medical: "./medical-info-jp.png"
    },

    cn: {
        main: "./main_cn.png",
        hospital: "./hospital_cn.png",
        pharmacy: "./pharmacy_cn.png",
        medical: "./medical-info-cn.png"
    },

    ru: {
        main: "./main_ru.png",
        hospital: "./hospital_ru.png",
        pharmacy: "./pharmacy_ru.png",
        medical: "./medical-info-ru.png"
    },

    vn: {
        main: "./main_vn.png",
        hospital: "./hospital_vn.png",
        pharmacy: "./pharmacy_vn.png",
        medical: "./medical-info-vn.png"
    },

    mn: {
        main: "./main_mn.png",
        hospital: "./hospital_mn.png",
        pharmacy: "./pharmacy_mn.png",
        medical: "./medical-info-mn.png"
    },

    ph: {
        main: "./main_ph.png",
        hospital: "./hospital_ph.png",
        pharmacy: "./pharmacy_ph.png",
        medical: "./medical-info-ph.png"
    }

};


/* ==================================================
   현재 언어
   ================================================== */

let currentLanguage = "en";


/* ==================================================
   현재 화면
   ================================================== */

let currentPage = "main";


/* ==================================================
   언어 메뉴 열기
   ================================================== */

function openLanguageMenu(event) {

    if (event) {
        event.stopPropagation();
    }

    document.getElementById("languageClose").style.display = "block";

    document.getElementById("languageMenu").style.display = "block";
}


/* ==================================================
   언어 메뉴 닫기
   ================================================== */

function closeLanguageMenu(event) {

    if (event) {

        event.stopPropagation();

    }

    document.getElementById("languageMenu").style.display = "none";

    document.getElementById("languageClose").style.display = "none";
}


/* ==================================================
   언어 선택
   ================================================== */

function selectLanguage(lang) {

    if (!languages[lang]) {
        return;
    }

    currentLanguage = lang;

    const data = languages[lang];


    /*
       MAIN 이미지 변경
    */
    document.getElementById("mainImage").src =
        data.main;


    /*
       HOSPITAL 이미지 변경
    */
    document.getElementById("hospitalImage").src =
        data.hospital;


    /*
       PHARMACY 이미지 변경
    */
    document.getElementById("pharmacyImage").src =
        data.pharmacy;


    /*
       메뉴 닫기
    */
    closeLanguageMenu();


    /*
       언어를 선택하면
       해당 국가 MAIN 화면으로 이동
    */
    showMain();
}


/* ==================================================
   MAIN 화면
   ================================================== */

function showMain() {

    document.getElementById("mainPage").style.display =
        "block";

    document.getElementById("hospitalPage").style.display =
        "none";

    document.getElementById("pharmacyPage").style.display =
        "none";

    currentPage = "main";
}


/* ==================================================
   병원 페이지
   ================================================== */

function openHospital() {

    const data = languages[currentLanguage];


    document.getElementById("hospitalImage").src =
        data.hospital;


    document.getElementById("mainPage").style.display =
        "none";

    document.getElementById("pharmacyPage").style.display =
        "none";

    document.getElementById("hospitalPage").style.display =
        "block";


    currentPage = "hospital";
}


/* ==================================================
   약국 페이지
   ================================================== */

function openPharmacy() {

    const data = languages[currentLanguage];


    document.getElementById("pharmacyImage").src =
        data.pharmacy;


    document.getElementById("mainPage").style.display =
        "none";

    document.getElementById("hospitalPage").style.display =
        "none";

    document.getElementById("pharmacyPage").style.display =
        "block";


    currentPage = "pharmacy";
}


/* ==================================================
   병원 찾기
   ================================================== */

function findHospital() {

    window.open(
        "https://www.google.com/maps/search/?api=1&query=hospital+near+me",
        "_blank"
    );
}


/* ==================================================
   응급실 찾기
   ================================================== */

function findEmergency() {

    window.open(
        "https://www.google.com/maps/search/?api=1&query=emergency+room+near+me",
        "_blank"
    );
}


/* ==================================================
   의료정보
   ================================================== */

function openMedicalInfo() {

    const data = languages[currentLanguage];

    window.location.href =
        data.medical;
}


/* ==================================================
   화면 전체 클릭 처리
   ================================================== */

/*
   혹시 backdrop 클릭 이벤트가
   브라우저나 모바일에서 제대로 전달되지 않는 경우에도
   언어 메뉴 바깥을 누르면 닫히도록 처리.
*/
document.addEventListener("click", function(event) {

    const menu =
        document.getElementById("languageMenu");

    const close =
        document.getElementById("languageClose");


    if (menu.style.display === "block") {

        if (!menu.contains(event.target) &&
            event.target !== close) {

            closeLanguageMenu();

        }

    }

});


/* ==================================================
   ESC 키
   ================================================== */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        closeLanguageMenu();

    }

});


/* ==================================================
   초기화
   ================================================== */

document.addEventListener("DOMContentLoaded", function() {

    const data = languages[currentLanguage];


    document.getElementById("mainImage").src =
        data.main;


    document.getElementById("hospitalImage").src =
        data.hospital;


    document.getElementById("pharmacyImage").src =
        data.pharmacy;


    showMain();

});

</script>

</body>
</html>
