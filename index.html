<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Busan Foreigner Safety Platform</title>
    <!-- 이미지 맵 반응형 자동 계산 라이브러리 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jQuery-rwdImageMaps/1.6/jquery.rwdImageMaps.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b1d3a;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }
        .main-img {
            width: 100%;
            height: auto;
            display: none;
        }
        .main-img.active {
            display: block;
        }

        /* 드롭다운 메뉴 스타일 */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 50px; 
            left: 10px;
            width: 160px;
            background-color: #12284c;
            border: 1px solid #234375;
            border-radius: 8px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            z-index: 9999999;
            padding: 5px 0;
        }
        .dropdown-menu a {
            display: block;
            color: #ffffff;
            padding: 12px 15px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #1c3966;
        }
        .dropdown-menu a:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ▣ 이미지 & 정밀 이미지 맵 바인딩 -->
        
        <!-- 1. 홈 화면 -->
        <img id="img-home" class="main-img active" src="home.png" alt="Home" usemap="#map-home">
        <map name="map-home">
            <!-- 4개 언어 버튼 -->
            <area shape="rect" coords="72,1125,928,1240" href="javascript:void(0)" onclick="goPage('en')" alt="English">
            <area shape="rect" coords="72,1255,928,1370" href="javascript:void(0)" onclick="goPage('cn')" alt="Chinese">
            <area shape="rect" coords="72,1385,928,1500" href="javascript:void(0)" onclick="goPage('jp')" alt="Japanese">
            <area shape="rect" coords="72,1515,928,1630" href="javascript:void(0)" onclick="goPage('vn')" alt="Vietnamese">
            <!-- 하단 긴급전화 3개 -->
            <area shape="rect" coords="72,1680,335,1880" href="tel:112" alt="112">
            <area shape="rect" coords="368,1680,631,1880" href="tel:119" alt="119">
            <area shape="rect" coords="664,1680,928,1880" href="tel:1330" alt="1330">
        </map>

        <!-- 2. 메인 화면들 -->
        <img id="img-en" class="main-img" src="main_en.png" alt="English" usemap="#map-main">
        <img id="img-cn" class="main-img" src="main_cn.png" alt="Chinese" usemap="#map-main">
        <img id="img-jp" class="main-img" src="main_jp.png" alt="Japanese" usemap="#map-main">
        <img id="img-vn" class="main-img" src="main_vn.png" alt="Vietnamese" usemap="#map-main">

        <map name="map-main">
            <!-- 상단 지구본 버튼 -->
            <area shape="rect" coords="20,15,300,90" href="javascript:void(0)" onclick="toggleDropdown(event)" alt="Language">
            <!-- CALL 버튼 3개 -->
            <area shape="rect" coords="60,695,330,785" href="tel:112" alt="112">
            <area shape="rect" coords="365,695,635,785" href="tel:119" alt="119">
            <area shape="rect" coords="670,695,940,785" href="tel:1330" alt="1330">
            <!-- 6대 카테고리 메뉴 -->
            <area shape="rect" coords="30,810,485,1160" href="javascript:void(0)" onclick="clickSubMenu('hospital')" alt="Hospitals">
            <area shape="rect" coords="515,810,970,1160" href="javascript:void(0)" onclick="clickSubMenu('pharmacy')" alt="Pharmacies">
            <area shape="rect" coords="30,1185,485,1535" href="javascript:void(0)" onclick="goPage('sub-embassy')" alt="Embassies">
            <area shape="rect" coords="515,1185,970,1535" href="https://minwon24.police.go.kr/cvlcpt/cvlcptAply.do?cvlcptId=MW-201&keyword=" target="_blank" alt="Lost&Found">
            <area shape="rect" coords="30,1560,485,1910" href="javascript:void(0)" onclick="goPage('sub-rules')" alt="Basic Rules">
            <area shape="rect" coords="515,1560,970,1910" href="https://www.google.com/maps/search/Busan+tourist+map" target="_blank" alt="Tourist Spots">
        </map>

        <!-- 3. 서브 화면 (기본수칙, 영사관) -->
        <img id="img-sub-rules" class="main-img" src="basicrules.png" alt="Basic Rules" usemap="#map-sub-common">
        <img id="img-sub-embassy" class="main-img" src="embassy.png" alt="Embassies" usemap="#map-sub-common">

        <!-- 4. 병원 서브 화면들 -->
        <img id="img-sub-hospital-en" class="main-img" src="hospital_en.png" alt="Hospital EN" usemap="#map-sub-common">
        <img id="img-sub-hospital-cn" class="main-img" src="hospital_cn.png" alt="Hospital CN" usemap="#map-sub-common">
        <img id="img-sub-hospital-jp" class="main-img" src="hospital_jp.png" alt="Hospital JP" usemap="#map-sub-common">
        <img id="img-sub-hospital-vn" class="main-img" src="hospital_vn.png" alt="Hospital VN" usemap="#map-sub-common">

        <!-- 5. 약국 서브 화면들 -->
        <img id="img-sub-pharmacy-en" class="main-img" src="pharmacy_en.png" alt="Pharmacy EN" usemap="#map-pharmacy">
        <img id="img-sub-pharmacy-cn" class="main-img" src="pharmacy_cn.png" alt="Pharmacy CN" usemap="#map-pharmacy">
        <img id="img-sub-pharmacy-jp" class="main-img" src="pharmacy_jp.png" alt="Pharmacy JP" usemap="#map-pharmacy">
        <img id="img-sub-pharmacy-vn" class="main-img" src="pharmacy_vn.png" alt="Pharmacy VN" usemap="#map-pharmacy">

        <map name="map-pharmacy">
            <!-- 상단 지구본 버튼 -->
            <area shape="rect" coords="20,15,300,90" href="javascript:void(0)" onclick="toggleDropdown(event)" alt="Language">
            <!-- 약국 상단 4개 카트 (112, 119, 1330, 심야약국 부산시 공식링크) -->
            <area shape="rect" coords="35,700,250,930" href="tel:112" alt="112">
            <area shape="rect" coords="275,700,490,930" href="tel:119" alt="119">
            <area shape="rect" coords="510,700,725,930" href="tel:1330" alt="1330">
            <area shape="rect" coords="745,700,960,930" href="https://www.busan.go.kr/eng/bsmedical06" target="_blank" alt="Late-Night Pharmacies">
        </map>

        <map name="map-sub-common">
            <!-- 일반 서브페이지 상단 지구본 -->
            <area shape="rect" coords="20,15,300,90" href="javascript:void(0)" onclick="toggleDropdown(event)" alt="Language">
        </map>

        <!-- 지구본 드롭다운 레이어 -->
        <div id="langDropdown" class="dropdown-menu">
            <a href="javascript:void(0)" onclick="goPage('home')">🏠 메인 (Home)</a>
            <a href="javascript:void(0)" onclick="goPage('en')">🇺🇸 English</a>
            <a href="javascript:void(0)" onclick="goPage('cn')">🇨🇳 中文 (简体)</a>
            <a href="javascript:void(0)" onclick="goPage('jp')">🇯🇵 日本語</a>
            <a href="javascript:void(0)" onclick="goPage('vn')">🇻🇳 Tiếng Việt</a>
        </div>

    </div>

    <script>
        var currentLang = 'en';

        function goPage(pageId) {
            if (!pageId) return;

            // 드롭다운 닫기
            var dropdown = document.getElementById('langDropdown');
            if (dropdown) dropdown.style.display = 'none';

            // 모든 이미지 숨기기
            var images = document.getElementsByClassName('main-img');
            for (var i = 0; i < images.length; i++) {
                images[i].classList.remove('active');
            }

            // Target 이미지 표시
            var targetImg = document.getElementById('img-' + pageId);
            if (targetImg) {
                targetImg.classList.add('active');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // 언어 정보 갱신
            if (pageId === 'en' || pageId === 'cn' || pageId === 'jp' || pageId === 'vn') {
                currentLang = pageId;
            }

            // 이미지 맵 크기 재계산 (반응형 핵심)
            setTimeout(function() {
                $('img[usemap]').rwdImageMaps();
            }, 100);
        }

        function toggleDropdown(event) {
            if (event) event.stopPropagation(); 
            var dropdown = document.getElementById('langDropdown');
            if (dropdown) {
                dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
            }
        }

        document.addEventListener('click', function(e) {
            var dropdown = document.getElementById('langDropdown');
            if (dropdown && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });

        function clickSubMenu(type) {
            if (type === 'hospital') {
                goPage('sub-hospital-' + currentLang);
            } else if (type === 'pharmacy') {
                goPage('sub-pharmacy-' + currentLang);
            }
        }

        $(document).ready(function() {
            goPage('home');
        });
    </script>

</body>
</html>
