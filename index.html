<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>SAFE IN BUSAN</title>

<style>

/* ==========================
   기본 설정
   ========================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;
}

body {

    display: flex;

    justify-content: center;

    align-items: center;
}


/* ==========================
   1080 × 1920 화면
   ========================== */

#app {

    position: relative;

    width: min(100vw, 56.25vh);

    height: min(100vh, 177.7778vw);

    max-width: 1080px;

    max-height: 1920px;

    aspect-ratio: 1080 / 1920;

    overflow: hidden;

    background: #fff;
}


/* ==========================
   메인 이미지
   ========================== */

#mainImage {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    display: block;

    user-select: none;

    -webkit-user-drag: none;

    /*
     * 이미지가 터치를 가로채지 않도록 설정
     */
    pointer-events: none;

    z-index: 1;
}


/* ==========================
   모든 터치 버튼
   ========================== */

.touch-button {

    position: absolute;

    display: block;

    z-index: 9999;

    background: transparent;

    border: none;

    outline: none;

    padding: 0;

    margin: 0;

    text-decoration: none;

    cursor: pointer;

    touch-action: manipulation;

    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;

    -webkit-appearance: none;

    appearance: none;
}


/* ==================================================
   112 POLICE
   기존 위치 그대로
   ================================================== */

.call112 {

    left: 2%;

    top: 32.3%;

    width: 31%;

    height: 13.7%;
}


/* ==================================================
   119 EMERGENCY
   기존 위치 그대로
   ================================================== */

.call119 {

    left: 34%;

    top: 32.3%;

    width: 31%;

    height: 13.7%;
}


/* ==================================================
   1330 TOURIST INFORMATION
   기존 위치 그대로
   ================================================== */

.call1330 {

    left: 66%;

    top: 32.3%;

    width: 32%;

    height: 13.7%;
}


/* ==================================================
   HOSPITAL
   기존 위치 그대로
   ================================================== */

.hospital {

    left: 2%;

    top: 47.0%;

    width: 47.8%;

    height: 16.8%;
}


/* ==================================================
   PHARMACY
   기존 위치 그대로
   ================================================== */

.pharmacy {

    left: 50.2%;

    top: 47.0%;

    width: 47.8%;

    height: 16.8%;
}


/* ==========================
   PC 화면
   ========================== */

@media (min-width: 1081px) {

    #app {

        width: 540px;

        height: 960px;

    }

}


/* ==========================
   휴대폰 화면
   ========================== */

@media (max-width: 600px) {

    #app {

        width: 100vw;

        height: 100vh;

        aspect-ratio: auto;

    }

}

</style>

</head>


<body>

<div id="app">


    <!-- =================================
         영어 메인 이미지
         ================================= -->

    <img
        id="mainImage"
        src="./main_en.png"
        alt="SAFE IN BUSAN"
        draggable="false"
    >


    <!-- =================================
         112 경찰
         ================================= -->

    <a
        href="tel:112"
        class="touch-button call112"
        aria-label="Call Police 112">
    </a>


    <!-- =================================
         119 소방 / 구급
         ================================= -->

    <a
        href="tel:119"
        class="touch-button call119"
        aria-label="Call Emergency 119">
    </a>


    <!-- =================================
         1330 관광안내
         ================================= -->

    <a
        href="tel:1330"
        class="touch-button call1330"
        aria-label="Call Tourist Information 1330">
    </a>


    <!-- =================================
         병원
         ================================= -->

    <a
        href="./hospital_en.png"
        class="touch-button hospital"
        aria-label="Hospitals">
    </a>


    <!-- =================================
         약국
         ================================= -->

    <a
        href="./pharmacy_en.png"
        class="touch-button pharmacy"
        aria-label="Pharmacies">
    </a>


</div>

</body>

</html>
